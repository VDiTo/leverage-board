name: Refresh season data
on:
  schedule:
    - cron: "0 10 * * *"   # daily 10:00 UTC = 6 AM Eastern (5 AM in winter). Picks up results, polls, SP+, lines, TV
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/fetch-data.mjs
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
          SEASON: "2026"
          PDF_TEAM: ${{ vars.PDF_TEAM || 'Notre Dame' }}
      - name: Build the one-page PDF
        env:
          TEAM: ${{ vars.PDF_TEAM || 'Notre Dame' }}
          N: "30000"
        run: |
          node scripts/make-pdf.mjs board.html
          PRODUCT=week node scripts/make-pdf.mjs week.html
          FIELD=1 node scripts/make-pdf.mjs board-field.html
          FIELD=1 PRODUCT=week node scripts/make-pdf.mjs week-field.html
          for p in board:Leverage-Board week:Top-10-Games board-field:Leverage-Board-Field week-field:Top-10-Games-Field; do
            google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf="${p#*:}.pdf" "file://$PWD/${p%%:*}.html"
          done
          rm -f board.html week.html board-field.html week-field.html
      - run: |
          git config user.name "leverage-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json Leverage-Board.pdf Top-10-Games.pdf Leverage-Board-Field.pdf Top-10-Games-Field.pdf
          git diff --staged --quiet || git commit -m "data: daily refresh"
          git push
