name: Refresh season data
on:
  schedule:
    # GitHub runs cron on a best-effort basis and drops top-of-the-hour jobs most often, so these sit off the hour.
    - cron: "17 10 * * *"          # daily 10:17 UTC (6:17 AM Eastern): results, polls, SP+, lines, TV
    - cron: "23 4,8 * * 5,6,0,1"   # game nights: 04:23 and 08:23 UTC Fri-Mon, catching Thu/Fri/Sat/Sun results
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/fetch-data.mjs
        env:
          CFBD_KEY: ${{ secrets.CFBD_KEY }}
          SEASON: "2026"
          PDF_TEAM: ${{ vars.PDF_TEAM || 'Notre Dame' }}
      - run: |
          git config user.name "leverage-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "data: daily refresh"
          git push
