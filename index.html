function renderBoard(r){
  const ap=D.polls&&D.polls.ap, cfp=D.polls&&D.polls.cfp;
  const src = D.meta&&D.meta.ratings ? D.meta.ratings : "SP+";
  $("#rankExplain").innerHTML = `<p>${cfp
    ? `Ordered by the <strong>CFP committee ranking</strong> (week ${cfp.week}), which is what actually seeds the bracket, with the AP poll alongside.`
    : `Ordered by the <strong>AP poll</strong> (week ${ap?ap.week:"—"}) until the CFP committee releases its first ranking in early November, then by the committee.`}
    ${T?`Unranked teams that often finish ahead of ${T} are included too.`:"Unranked teams with a real playoff chance are included too."}</p>
    <div class="legend">${T?`<span><i style="background:var(--for)"></i>You want them to win</span><span><i style="background:var(--against)"></i>You want them to lose</span><span><i style="background:var(--panel2)"></i>Doesn't affect you</span><span><i style="border:1.5px solid var(--gold);background:transparent"></i>Head-to-head with you</span><span>Your own row is shaded by each game's leverage on your own schedule</span>`:`<span><i style="background:var(--fieldhue)"></i>Shapes the playoff field</span><span><i style="background:var(--panel2)"></i>Doesn't change who gets in</span>`}<span><i style="border:1.5px solid var(--against);background:transparent"></i>In progress (red LIVE line, pregame → live chance)</span><span><i style="background:var(--panel2);border:1px solid var(--line)"></i>Final (W/L, score, and how much the result moved ${T?"your odds":"the field"} from kickoff${T?": green helped, red hurt":""}; 0 = an expected result, already priced in)</span><span>Darker = higher leverage score · "@" = on the road · % = their chance of winning · kickoff is a 24-hour clock in your local time</span></div>
    <p>Each cell is that week's opponent and the row team's chance of winning, from the <strong>${src}</strong> rating gap plus home advantage. Posted point spreads are shown for reference; the simulation uses SP+. ${T?`Shading shows whether ${T} wants the row team to win or lose that game, and how much: it follows the <strong>leverage score</strong>, so a lopsided game fades even when the upset would matter.`:"With no team selected, gold shading shows how much each game shapes the whole playoff field: how often flipping its result changes who gets in, discounted by how unlikely that is."}</p>`;

  const weeks=[...new Set(D.games.map(g=>g.week))].sort((a,b)=>a-b);
  const stat=new Map(r.teamStats.map(t=>[t.team,t]));
  document.querySelectorAll("#boardSort button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===UI.boardSort)));
  const rankKey = t => useCfp() ? (t.cfpRank||99) : (t.apRank||99);
  const rankedTeams = D.teams.filter(t=>!t.fcs && t.team!==T && (useCfp()?t.cfpRank:t.apRank));
  const unrankedTeams = D.teams.filter(t=>!t.fcs && t.team!==T && !(useCfp()?t.cfpRank:t.apRank) && stat.get(t.team).pIn>=UI.boardMin);
  const byRank=(a,b)=>rankKey(a)-rankKey(b) || stat.get(b.team).pIn-stat.get(a.team).pIn;
  const byPIn=(a,b)=>stat.get(b.team).pIn-stat.get(a.team).pIn || rankKey(a)-rankKey(b);
  let ordered, splitAt=-1;
  if(UI.boardSort==="pIn"){ ordered=[...rankedTeams,...unrankedTeams].sort(byPIn); }
  else { ordered=[...rankedTeams.sort(byRank), ...unrankedTeams.sort(byPIn)]; splitAt=rankedTeams.length; }
  const rows=[...(T?[T]:[]), ...ordered.map(t=>t.team)];
  const sepBefore = splitAt>=0 && unrankedTeams.length ? rows[(T?1:0)+splitAt] : null;
  const maxPIn=Math.max(0.01,...rows.map(n=>stat.get(n).pIn));

  // shading = the same 0-100 leverage score as the pills, signed by who the target wants
  const lev=new Map(); r.games.forEach(g=>lev.set(g.i, g.clear ? Math.sign(g.swing)*g.levN*(g.sure?1:0.5) : 0));
  // finished games: the impact score, signed by whether the result helped the selected team
  const real=new Map(); (r.played||[]).forEach(g=>real.set(g.i,g));
  // every final carries a number: a muted 0 when the result was already priced in
  const realCell=g=>{ if(!g) return null; const v=Math.round(g.impN);
    if(v===0 || !g.clear) return {txt:"0", cls:"zero"};
    if(!T) return {txt:String(v), cls:"field"+(g.sure?"":" soft")};
    return {txt:(g.realized>0?"+":"−")+v, cls:(g.realized>0?"good":"bad")+(g.sure?"":" soft")}; };
  const cellFoot=c=> c.kick ? `<small class="tv">${c.kick}</small>` : c.real ? `<small class="real ${c.real.cls}" title="How much this result moved ${T?short(T)+"'s":"the field's"} odds from kickoff, on the impact scale${T?": green helped, red hurt":""}">${c.real.txt}</small>` : "";
  const scale=100;
  const byTeam=new Map();
  D.games.forEach((g,i)=>{
    const sw=lev.get(i)||0;
    for(const [t,opp,isHome] of [[g.home,g.away,1],[g.away,g.home,0]]){
      if(!byTeam.has(t)) byTeam.set(t,new Map());
      const pWin = isHome ? gP[i] : 1-gP[i];
      let result=null;
      if(g.completed){ const won = isHome ? g.homeWin : !g.homeWin;
        const mine = isHome ? g.homeScore : g.awayScore, theirs = isHome ? g.awayScore : g.homeScore;
        result={won, text:(won?"W":"L")+(mine!=null&&theirs!=null?` ${mine}-${theirs}`:"")}; }
      const liveTxt = g.live ? `LIVE ${g.live.period>=5?"OT":g.live.period>=1?"Q"+g.live.period:""} ${isHome?g.live.hs:g.live.as}-${isHome?g.live.as:g.live.hs}` : "";
      const pPre = isHome ? gPsp[i] : 1-gPsp[i];
      { const lst=byTeam.get(t); if(!lst.has(g.week)) lst.set(g.week,[]); lst.get(g.week).push({opp,isHome,pWin,pPre,live:!!g.live,result,sw:isHome?sw:-sw,mine:t===T||opp===T,kick:g.completed?"":(liveTxt||fmtKickShort(g)),gi:g.completed?(real.has(i)?i:null):i,real:g.completed?realCell(real.get(i)):null}); }
    }
  });

  const summary=(()=>{ // one row per board: highest and average leverage of the week side by side (own games excluded);
      // once every game of a week is final, the net change to the target's playoff chance from that week's results instead
      const byWeek=new Map(); r.games.filter(g=>!g.involvesMe).forEach(g=>{ if(!byWeek.has(g.week)) byWeek.set(g.week,[]); byWeek.get(g.week).push(g.clear?g.levN:0); });
      const playedBy=new Map(); (r.played||[]).forEach(g=>{ if(!playedBy.has(g.week)) playedBy.set(g.week,[]); playedBy.get(g.week).push(g); });
      const pair=(hi,avg)=>`<span class="pair">${scorePill(hi,true)}${scorePill(avg,true)}</span>`;
      const cell=w=>{
        const done = playedBy.has(w) && !r.games.some(g=>g.week===w);
        if(done){ const Pw=playedBy.get(w);
          if(T){ const net=Pw.reduce((a,g)=>a+g.realized,0)*100, mag=Math.abs(net);
            const cls=net>0.005?"good":net<-0.005?"bad":"zero";
            return `<td class="c"><b class="net num ${cls}" title="Net change to ${T}'s playoff chance from week ${w}'s results">${net>0.005?"+":net<-0.005?"−":""}${mag<0.95?mag.toFixed(2):mag.toFixed(1)}</b></td>`; }
          // no team: the week's results combined, on the same 0-100 impact scale (100 = the biggest game still to come)
          const tot=Pw.reduce((a,g)=>a+Math.abs(g.realized),0), ref=Math.max(1e-6,...r.games.filter(g=>g.clear).map(g=>Math.abs(g.swing)));
          return `<td class="c">${scorePill(Math.min(100,tot/ref*100),true)}</td>`; }
        const L=byWeek.get(w); if(!L||!L.length) return `<td class="r sub">—</td>`;
        return `<td class="c">${pair(Math.max(...L), L.reduce((a,b)=>a+b,0)/L.length)}</td>`; };
      return `<tr class="sum"><td class="k"><span class="sumlab" role="button" title="${sumTip().replace(/"/g,"&quot;")}">Impact/Leverage <i>i</i></span></td><td class="sub" style="font-size:11px;white-space:normal;line-height:1.1">all games</td>${weeks.map(cell).join("")}</tr>`;
    })();
  $("#rankings").innerHTML = `<tr><th>Team</th><th class="c">Playoff</th>${weeks.map(w=>`<th>Wk ${w}</th>`).join("")}</tr>`+ summary +
    rows.map(t=>{
      const tm=D.teams[idx.get(t)], m=byTeam.get(t)||new Map(), st=stat.get(t);
      const rk=(v,hot)=>v?(hot?`<b>${v}</b>`:v):"NR";
      const rkNo = useCfp() ? tm.cfpRank : tm.apRank;
      return (T && t!==T && rows[0]===T && rows[1]===t ? `<tr class="sep"><td colspan="${weeks.length+2}"></td></tr>` : "")
        + (sepBefore===t ? `<tr class="sep lab"><td colspan="${weeks.length+2}">Unranked · playoff chance ${UI.boardMin<=1?"≥ "+Math.round(UI.boardMin*100)+"%":""}</td></tr>` : "")
        + `<tr class="${t===T?"me":""}"><td class="k">${rkNo?`<span class="rk">#${rkNo}</span> `:""}${tn(t,short(t))}</td><td class="r"><span class="ramp num" style="${ramp(st?st.pIn:0,"var(--for)",maxPIn)};padding:2px 6px">${st?Math.round(st.pIn*100):0}%</span></td>`+weeks.map(w=>{
        const cs=m.get(w); if(!cs) return `<td><span class="cell"><small>bye</small></span></td>`;
        // a team can play twice in one data week (week 1 covers two weekends): stack the cells
        return `<td${cs.length>1?' class="multi"':""}>`+cs.map(c=>{
        const sub = c.result ? c.result.text : c.live ? `${Math.round(c.pPre*100)}%→<b class="${c.pWin>c.pPre+0.005?"good":c.pWin<c.pPre-0.005?"bad":""}">${Math.round(c.pWin*100)}%</b>` : `${Math.round(c.pWin*100)}%`;
        const res = c.result ? (c.result.won?" w":" l") : "";
        // the selected team's own row: shade by each game's leverage on its own 0-100 schedule scale
        if(t===T){
          const a=Math.min(1,Math.abs(c.sw)/100), mix=c.result||a<0.005?0:Math.round(8+Math.pow(a,0.7)*82);
          const bg=mix?`color-mix(in srgb, var(--for) ${mix}%, transparent)`:"transparent";
          return `<span class="cell own${res}${c.result?" done":""}${c.live?" live":""}${mix>=55?" hot":""}"${c.gi!=null?` data-game="${c.gi}" role="button"`:""} style="background:${bg}">${c.isHome?"":"@"}${short(c.opp)}<small class="num">${sub}</small>${cellFoot(c)}</span>`;
        }
        // head-to-head with the selected team in another row: marked, not ramped. You already know you want to win it.
        if(c.mine) return `<span class="cell h2h${res}${c.result?" done":""}${c.live?" live":""}"${c.gi!=null?` data-game="${c.gi}" role="button"`:""}>${c.isHome?"":"@"}${short(c.opp)}<small class="num">${sub}</small>${cellFoot(c)}</span>`;
        let a = Math.min(1, Math.abs(c.sw)/scale);
        if(Math.abs(c.sw)<0.5) a=0;
        const mix = a===0 ? 0 : Math.round(8+Math.pow(a,0.7)*82); // identical curve to the score pills
        const bg = a===0 ? "transparent" : `color-mix(in srgb, ${!T?"var(--fieldhue)":c.sw>0?"var(--for)":"var(--against)"} ${mix}%, transparent)`;
        return `<span class="cell${res}${c.result?" done":""}${c.live?" live":""}${mix>=60?" hot":""}"${c.gi!=null?` data-game="${c.gi}" role="button"`:""} style="background:${bg}">${c.isHome?"":"@"}${short(c.opp)}<small class="num">${sub}</small>${cellFoot(c)}</span>`;
        }).join("")+`</td>`;
      }).join("")+`</tr>`;
    }).join("");
}

// One card renderer for both the weekly slate and the season list
function card(g, showWeek){
  const wantHome=g.swing>0, want=wantHome?g.home:g.away;
  const line=g.spreadText ? `<b>${g.spreadText}</b>${g.overUnder?` · O/U ${g.overUnder}`:""}` : `<b>No line</b>`;
  // SP+ vs market: flag games where the two disagree by 10+ points of win probability
  let dev="";
  if(g.pLine!=null && Math.abs(g.pSp-g.pLine)>=0.10){
    const spFav = g.pSp>=0.5 ? g.home : g.away, spP = g.pSp>=0.5 ? g.pSp : 1-g.pSp;
    const mkP = spFav===g.home ? g.pLine : 1-g.pLine;
    dev=`<div class="g-dev">SP+ and the market disagree: SP+ has <b>${short(spFav)}</b> at ${Math.round(spP*100)}%, the line says ${Math.round(mkP*100)}%</div>`;
  }
  const when = g.live ? `<span class="livetag">LIVE</span> ${g.live.period>=5?"OT":g.live.period>=1?"Q"+g.live.period+" "+g.live.clock:"starting"} · ${short(g.away)} ${g.live.as}, ${short(g.home)} ${g.live.hs}` : fmtKick(g);
  const impact=Math.abs(g.swing)*100;
  // the team you're pulling for is boxed; each team carries its win chance
  // live games show the shift from the pregame chance to the in-game chance
  const chip=(team,win)=>{ const boxed = !T ? false : g.involvesMe ? team===T : (g.clear && team===want);
    const pre = g.live ? (team===g.home ? g.pSp : 1-g.pSp) : null;
    const pctTxt = g.live ? `${fmtWin(pre)}% → <b class="${win>pre+0.005?"good":win<pre-0.005?"bad":""}">${fmtWin(win)}%</b>` : `${fmtWin(win)}%`;
    // the rooting-interest team carries its win chance in a green pill; the other team's is implied
    const pillFor = boxed || (!T && !g.clear ? false : (!boxed && !g.clear && !g.involvesMe && team===(g.pHomeWin>=0.5?g.home:g.away)));
    if(pillFor){
      const mix=Math.round(8+Math.pow(win,0.7)*82);
      return `<span class="chip${boxed?(g.involvesMe?" mine":" want"):""}">${badge(team)} <span class="winpill num" style="background:color-mix(in srgb, var(--for) ${mix}%, transparent);${mix>=65?"color:#fff":""}">${pctTxt}</span></span>`;
    }
    return `<span class="chip">${badge(team)}</span>`; };
  const noise = Math.abs(g.swing)<0.001 ? (T?"no measurable effect":"never changes the field") : `too close to call (±${(2*g.se*100).toFixed(2)}${T?" pts":"%"})`;
  // the selected team's own game: tint the card by its chance of winning, same ramp as the board
  const own = g.involvesMe ? " own" : "";
  const curWk = RES ? Math.min(...RES.games.map(x=>x.week)) : null;
  const thisWeek = showWeek && g.week===curWk;
  return `<div class="g${own}${dev?" dev":""}${thisWeek?" thisweek":""}">
    <div class="g-top"><div><span>${thisWeek?`<span class="wktag">This week</span> `:""}${when}${g.tv?` · ${g.tv}`:""}</span>${showWeek ? `<div class="wkrow" title="Week ${g.week}" aria-label="Week ${g.week}">${[...new Set(RES.games.map(x=>x.week))].sort((a,b)=>a-b).map(w=>`<span class="${w===g.week?"on":""}${w===curWk?" now":""}" title="Week ${w}">${w}</span>`).join("")}<small class="sub" style="margin-left:6px">wk ${g.week}</small></div>` : ""}</div><span class="lev why" data-game="${g.i}" role="button" title="Why?"><span>Leverage ${scorePill(g.lev>0?g.levN:null, g.sure)}</span><small>Impact ${scorePill(g.lev>0?g.impN:null, g.sure)}</small>${g.clear?(g.sure?"":`<small>estimate ±${(2*g.se*100).toFixed(2)} pts</small>`):`<small>${noise}</small>`}</span></div>
    <div class="g-match">${chip(g.away,1-g.pHomeWin)} <em>at</em> ${chip(g.home,g.pHomeWin)}</div>
    <div class="g-line">${line}${!T && g.clear ? ` · <span class="num">changes the field in ${pct(g.swing)}% of seasons</span>${g.fieldTop&&g.fieldTop.length?` · mostly ${g.fieldTop.slice(0,2).map(t=>short(t.team)).join(", ")}`:""}` : ""}</div>${dev}
  </div>`;
}

function renderSlate(r){
  const upWeeks=[...new Set(r.games.map(g=>g.week))];
  const weeks=[...new Set([...upWeeks, ...(r.played||[]).map(g=>g.week)])].sort((a,b)=>a-b);
  // default: the earliest week that still has games to play
  if(UI.slateWeek===null||!weeks.includes(UI.slateWeek)) UI.slateWeek = upWeeks.length ? Math.min(...upWeeks) : weeks[weeks.length-1];
  const ws=$("#slateWeek"); ws.innerHTML=weeks.map(w=>`<option value="${w}" ${w===UI.slateWeek?"selected":""}>Week ${w}</option>`).join("");
  document.querySelectorAll("#slateSort button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===UI.slateSort)));
  document.querySelectorAll("#slateView button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===UI.slateView)));
  const playedView = UI.slateView==="played";
  $("#slateSort").hidden = playedView;
  $("#slateMinText").textContent = playedView ? "Min impact" : "Min leverage";
  $("#slateTitle").textContent=`Week ${UI.slateWeek} ${playedView?"results":"slate"}`;
  if(RES) labelPdfButtons();
  const playedWk=(r.played||[]).filter(g=>g.week===UI.slateWeek);
  const upWk=r.games.filter(g=>g.week===UI.slateWeek);
  const fmtPts=v=>{ const m=Math.abs(v); return (v>0.005?"+":v<-0.005?"−":"")+(m<0.95?m.toFixed(2):m.toFixed(1)); };
  // the week so far, shown above both views: net effect of the finals, the live effect of games in progress
  // (how far the in-game win chances have moved the odds from the kickoff baseline), and what's still to play
  const liveWk=upWk.filter(g=>g.live);
  const net = T ? playedWk.reduce((a,g)=>a+g.realized,0)*100 : 0;
  const liveShift = T ? liveWk.reduce((a,g)=>a+(g.pHomeWin-g.pSp)*(g.pH-g.pA),0)*100 : 0;
  const signed=v=>`<b class="${v>0.005?"good":v<-0.005?"bad":""}" style="text-transform:none">${fmtPts(v)} pts</b>`;
  const toPlay=upWk.length-liveWk.length;
  const strip = (playedWk.length||liveWk.length) ? `<div class="slate-div pulse" title="${T?"Net change to "+T+"'s playoff chance from this week's results so far; the live figure follows the in-game win chances":"This week's results so far"}">Week ${UI.slateWeek} so far${
      playedWk.length ? ` · ${T?signed(net)+" from":""} ${playedWk.length} final${playedWk.length>1?"s":""}` : ""}${
      liveWk.length ? ` · <span class="dot on"></span>${T?signed(liveShift)+" live in":""} ${liveWk.length} in progress` : ""}${
      toPlay ? ` · ${toPlay} still to play` : ""}</div>` : "";

  if(playedView){
    $("#slateExplain").innerHTML = !T ? `<p>Games already played this week, ranked by how much each result reshaped the playoff field, weighed by how unexpected it was.</p>`
      : `<p>Games already played this week, ranked by how much each result moved <strong>${T}</strong>'s playoff odds from where they stood at kickoff. An expected win barely moves them; an upset does. Green went your way, red went against you. <strong>Impact</strong> is on the same 0–100 scale as the games still to come.</p>`;
    let list=playedWk;
    if(UI.slateRanked) list=list.filter(g=>g.involvesMe||isRanked(g.home)||isRanked(g.away));
    const hidden=list.filter(g=>!g.involvesMe && !(g.clear && g.impN>=UI.slateMin)).length;
    list=list.filter(g=>g.involvesMe || (g.clear && g.impN>=UI.slateMin));
    const mine=list.filter(g=>g.involvesMe), rest=list.filter(g=>!g.involvesMe).sort((a,b)=>Math.abs(b.realized)-Math.abs(a.realized));
    $("#slate").innerHTML = (playedWk.length ? strip + mine.concat(rest).map(cardPlayed).join("") : `<div class="sub" style="padding:10px 0">No games played yet this week.</div>`)
      + (hidden ? `<div class="sub" style="padding:10px 0">${hidden} game${hidden>1?"s":""} ${UI.slateMin>0?"below impact "+UI.slateMin:"with no measurable effect"} hidden.</div>` : "");
    return;
  }

  $("#slateExplain").innerHTML = !T ? `<p>No team selected. <strong>Impact</strong> is how often flipping a game's result changes who makes the 12-team field. <strong>Leverage</strong> discounts that by how unlikely the swing is. Both are scaled 0–100 against the biggest game left. Tap a leverage score to see which teams a game tends to swap in and out.</p>` : `<p><strong>Impact</strong> is how much ${T}'s playoff odds move between the two outcomes of a game. <strong>Leverage</strong> is impact × how uncertain the game is: a coin flip keeps its full impact, a 97/3 game keeps about a tenth, because the result you'd want almost never happens. Both are scaled 0–100. Other teams' games are scored against the biggest such game left on the schedule; <strong>${T}'s own games are scored against each other</strong>, so your biggest game of the year is 100. Darker gold = higher score. Sort by kickoff to follow the day. Games with a gold edge are ones where <strong>SP+ and the betting market disagree</strong> by 10 or more points of win probability; the simulation always uses SP+.</p>`;
  let list=upWk;
  if(UI.slateRanked) list=list.filter(g=>g.involvesMe||isRanked(g.home)||isRanked(g.away));
  const hidden = UI.slateMin>0 ? list.filter(g=>!g.involvesMe && !(g.clear && g.levN>=UI.slateMin)).length : 0;
  if(UI.slateMin>0) list=list.filter(g=>g.involvesMe || (g.clear && g.levN>=UI.slateMin));
  // games in progress that pass the filters are grouped first
  const liveNow=list.filter(g=>g.live && !g.involvesMe).sort((a,b)=>b.lev-a.lev); list=list.filter(g=>!(g.live && !g.involvesMe));
  const byTime=(a,b)=>(a.tbd-b.tbd)||((a.start?Date.parse(a.start):9e15)-(b.start?Date.parse(b.start):9e15))||(b.lev-a.lev);
  // the selected team's own game always leads; everything else follows the chosen sort
  const mine=list.filter(g=>g.involvesMe), rest=list.filter(g=>!g.involvesMe);
  rest.sort(UI.slateSort==="time" ? byTime : (a,b)=>b.lev-a.lev);
  const div=(label,cls)=>`<div class="slate-div${cls?" "+cls:""}">${label}</div>`;
  const liveHtml = liveNow.length ? div('<span class="dot on"></span>Live now',"live") + liveNow.map(g=>card(g,false)).join("") : "";
  const restLabel = liveNow.length ? "Coming up" : `Rest of the slate · by ${UI.slateSort==="time"?"kickoff":"leverage score"}`;
  const restHtml = rest.length ? ((liveNow.length||mine.length) ? div(restLabel) : "") + rest.map(g=>card(g,false)).join("") : "";
  const html = mine.map(g=>card(g,false)).join("") + liveHtml + restHtml;
  const finalsNote = playedWk.length ? `<div class="sub" style="padding:12px 0">${playedWk.length} game${playedWk.length>1?"s":""} already played this week: <a href="#" class="tolink" data-view="played">see the results</a>.</div>` : "";
  $("#slate").innerHTML = strip + (html || `<div class="sub" style="padding:10px 0">${upWk.length?"No games match.":"No games left to play this week."}</div>`) + (hidden ? `<div class="sub" style="padding:10px 0">${hidden} game${hidden>1?"s":""} below leverage ${UI.slateMin} hidden.</div>` : "") + finalsNote;
}

// A finished game on the Played list: the score, and what the result did to the selected team's odds
function cardPlayed(g){
  const winner=g.homeWin?g.home:g.away, loser=g.homeWin?g.away:g.home;
  const want = T && g.clear ? (g.swing>0?g.home:g.away) : null;
  const helped = T ? g.realized>0 : null, cls=helped?"good":"bad";
  const pts=Math.abs(g.realized)*100, ptsTxt=pts<0.95?pts.toFixed(2):pts.toFixed(1);
  const weeksAll=[...new Set(D.games.map(x=>x.week))].sort((a,b)=>a-b);
  const curWk = RES && RES.games.length ? Math.min(...RES.games.map(x=>x.week)) : null;
  const chip=(team,sc)=>`<span class="chip">${badge(team)} <b class="num ${team===winner?"good":"bad"}" style="font-weight:650">${sc??""}</b></span>`;
  const pActual=g.homeWin?g.pH:g.pA;
  const pWinPre = g.homeWin ? g.pSp : 1-g.pSp;
  const line = !T ? (g.clear ? `<span class="num">had ${short(loser)} won, the field would differ in ${pct(g.swing)}% of seasons</span>${g.fieldTop&&g.fieldTop.length?` · mostly ${g.fieldTop.slice(0,2).map(t=>short(t.team)).join(", ")}`:""}` : "no effect on who gets in")
    : !g.clear ? `<span class="num">${short(T)} ${pct(pActual)}% after, ${pct(g.pBefore)}% at kickoff</span>${pWinPre>=0.75?" · expected result, already priced in":""}`
    : `<span class="num">${short(T)} <b class="${cls}">${pct(pActual)}%</b> after this result, ${pct(g.pBefore)}% at kickoff</span>`;
  const verdict = !T ? "" : g.involvesMe ? (winner===T?"You won":"You lost") : !g.clear ? "Didn't matter" : !g.sure ? (helped?"Leaned your way":"Leaned against you") : (helped?"Went your way":"Went against you");
  return `<div class="g played${g.involvesMe?" own":""}">
    <div class="g-top"><div><span>${g.start?fmtKick(g):""}${g.tv?` · ${g.tv}`:""}</span><div class="wkrow" title="Week ${g.week}" aria-label="Week ${g.week}">${weeksAll.map(w=>`<span class="${w===g.week?"on":""}${w===curWk?" now":""}" title="Week ${w}">${w}</span>`).join("")}<small class="sub" style="margin-left:6px">wk ${g.week}</small></div></div><span class="lev why" data-game="${g.i}" role="button" title="Why?"><span>Impact ${scorePill(g.clear?g.impN:null, g.sure)}</span>${T&&g.clear?`<small class="${cls}"><b class="num">${helped?"+":"−"}${ptsTxt}</b> pts${g.sure?"":" (±"+(2*g.se*100).toFixed(2)+")"}</small>`:`<small>${verdict||(g.clear?"":"no effect on the field")}</small>`}</span></div>
    <div class="g-match">${chip(g.away,g.awayScore)} <em>at</em> ${chip(g.home,g.homeScore)}</div>
    <div class="g-line">${verdict&&T&&g.clear?`<b>${verdict}.</b> `:""}${line}</div>
  </div>`;
}
function renderPlayed(r){
  const played=(r.played||[]).slice();
  const clear=played.filter(g=>g.clear);
  const kept=clear.filter(g=>g.impN>=UI.seasonMin).sort((a,b)=>Math.abs(b.realized)-Math.abs(a.realized));
  const below=clear.length-kept.length, quiet=played.length-clear.length;
  $("#seasonExplain").innerHTML = !T ? `<p>Every game already played, ranked by how much the result reshaped the playoff field: how often the twelve teams would differ had it gone the other way, weighed by how unexpected the result was.</p>`
    : `<p>Every game already played, ranked by how much the result moved <strong>${T}</strong>'s playoff odds from where they stood at kickoff. An expected win barely moves them; an upset does. Green went your way, red went against you. <strong>Impact</strong> is on the same 0–100 scale as the games still to come, so what has happened compares directly with what's left.</p>`;
  $("#season").innerHTML = (played.length ? (kept.map(cardPlayed).join("") || `<div class="sub" style="padding:10px 0">No played games at or above impact ${UI.seasonMin}.</div>`) : `<div class="sub" style="padding:10px 0">No games have been played yet.</div>`)
    + (below?`<div class="sub" style="padding:10px 0">${below} game${below>1?"s":""} below impact ${UI.seasonMin} hidden.</div>`:"")
    + (quiet?`<details class="quiet"><summary>${quiet} more played game${quiet>1?"s":""} that barely moved ${T?T+"'s odds":"the field"}</summary><div class="sub" style="margin-top:6px">${T?"Mostly expected results, already priced into the odds before kickoff.":"Mostly expected results that leave the twelve-team field as it was."}</div></details>`:"");
}
function renderSeason(r){
  document.querySelectorAll("#seasonView button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===UI.seasonView)));
  const playedView = UI.seasonView==="played";
  $("#seasonSort").hidden = playedView;
  $("#seasonMinText").textContent = playedView ? "Min impact" : "Min leverage";
  if(playedView){ renderPlayed(r); return; }
  document.querySelectorAll("#seasonSort button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===UI.seasonSort)));
  $("#seasonExplain").innerHTML = !T ? `<p>Every remaining game, ranked by how much it shapes the playoff field: how often flipping the result changes who gets in, discounted by how unlikely the swing is.</p>` : `<p>Every remaining game <strong>not involving ${T}</strong>, ranked by how much it matters to ${T}. Your own games are left out because they obviously dwarf everything else; they're on the Top 25 board and the weekly slate. <strong>Impact</strong> is the swing in playoff odds between the two outcomes; <strong>leverage</strong> discounts that by how unlikely the swing is to happen. Both are scaled 0–100 against the biggest of these games, and darker gold means a higher score.</p>`;
  const all=r.games.filter(g=>g.clear&&!g.involvesMe);
  const kept=all.filter(g=>g.levN>=UI.seasonMin);
  const sorter = UI.seasonSort==="impact" ? (a,b)=>Math.abs(b.swing)-Math.abs(a.swing) : (a,b)=>b.lev-a.lev;
  const list=kept.sort(sorter).slice(0,60);
  // one list in rank order; games in the current week are tagged, not moved
  const sections = list.map(g=>card(g,true)).join("");
  const below=all.length-kept.length, quiet=r.games.filter(g=>!g.clear&&!g.involvesMe).length;
  $("#season").innerHTML = (sections || `<div class="sub" style="padding:10px 0">No games at or above leverage ${UI.seasonMin}.</div>`)
    + (below?`<div class="sub" style="padding:10px 0">${below} game${below>1?"s":""} below leverage ${UI.seasonMin} hidden.</div>`:"")
    + (quiet?`<details class="quiet"><summary>${quiet} more games with no measurable effect on ${T}</summary><div class="sub" style="margin-top:6px">They move the odds by less than a tenth of a point either way.</div></details>`:"");
}
</script>
</body>
</html>
