<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leverage Board</title>
<meta name="theme-color" content="#0c2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leverage">
<link rel="manifest" href="manifest.webmanifest">
<script src="sim.js"></script>
<script src="pdf.js" defer></script>
<script src="live.js" defer></script>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
  :root{
    --field:#ffffff; --panel:#f2f5f9; --panel2:#e4eaf2; --line:#c9d3df;
    --ink:#0c2340; --muted:#4f6079; --gold:#0c2340;
    --for:#3fa96b; --against:#c65442; --flat:#b4c0cf;
    --pillhue:#3fa96b;
  }
  body:not(.light){--pillhue:var(--gold)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--field);color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%}
  body{padding:0 0 64px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 14px}
  h1,h2,.serif{font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;font-weight:600}
  h1{font-size:24px;letter-spacing:-.01em;margin:0}
  h2{font-size:19px;margin:26px 0 6px;color:var(--ink)}
  h3{font-size:14.5px;margin:22px 0 6px;font-weight:600}
  .sub{color:var(--muted);font-size:13px}
  .num{font-variant-numeric:tabular-nums}
  /* section descriptions live behind an "i" button; tap to open */
  .explain{color:var(--muted);font-size:13.5px;max-width:760px;margin:0 0 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .explain:not(.open){display:none}
  .explain strong{color:var(--ink);font-weight:600}
  .explain p{margin:0 0 8px} .explain p:last-child{margin-bottom:0}
  h2{display:flex;align-items:center;gap:9px}
  .info{width:20px;height:20px;border-radius:50%;padding:0;background:transparent;color:var(--gold);border:1.5px solid var(--gold);
    font:italic 600 12px/1 Georgia,serif;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .info[aria-expanded=true]{background:var(--gold);color:#10233a}

  header{border-bottom:1px solid var(--line);padding:14px 0 12px;background:linear-gradient(180deg,var(--panel),var(--field))}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  select,button,input{font:inherit;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;padding:8px 10px}
  select{max-width:100%}
  button{cursor:pointer;background:var(--gold);color:#10233a;border-color:var(--gold);font-weight:650}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent;color:var(--gold);border-color:var(--gold);font-weight:600}
  /* print fallback: just the board and its explanation, on a light landscape page */
  @media print{
    @page{size:landscape;margin:0.3in}
    html,body{background:#fff;color:#10233a;font-size:8pt}
    header .bar,header .prog,#cacheNote,nav.tabs,.foot,.modal,section.tab,.info,.controls{display:none!important}
    body.print-board #tab-board, body.print-slate #tab-slate{display:block!important}
    body:not(.print-slate) #tab-board{display:block!important}
    .explain{display:block!important;background:#fff;border:0;padding:0;color:#3a4a60;max-width:none}
    .g{break-inside:avoid;color:#10233a} .g-top,.g-line,.g-line b{color:#3a4a60} .g-match{color:#10233a} .chip small{color:#5a6b80}
    .g.own{background:color-mix(in srgb, #c9a44c 10%, white)!important;color:#10233a} .g.own .g-top,.g.own .g-line{color:#3a4a60}
    .pill{color:#10233a}
    #tab-board .scroll{overflow:visible;margin:0;padding:0;width:auto}
    h1,h2{color:#10233a} .sub{color:#5a6b80}
    th{position:static;background:#fff;color:#5a6b80} td{border-bottom-color:#e6eaf0}
    td.k{position:static;background:#fff;color:#10233a;box-shadow:none} tr.me td.k{color:#8a6f2e}
    .cell{color:#10233a;font-size:6.5pt;min-width:0;padding:1px 3px} .cell small{color:#4a5a70;font-size:5.6pt} .cell small.tv{display:none}
    .cell.h2h{color:#8a6f2e;border-color:#c9a44c} .cell.h2h small{color:#8a6f2e}
    .cell.hot small{color:#4a5a70}
    .legend{color:#3a4a60}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
  select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
  .dot.on{background:var(--against);box-shadow:0 0 0 3px color-mix(in srgb, var(--against) 25%, transparent)}
  .dot.err{background:#c9a44c}
  .livetag{color:var(--against);font-weight:700}
  .prog{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:10px}
  .prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .12s}

  /* ---- tabs ---- */
  nav.tabs{position:sticky;top:0;z-index:5;background:var(--field);border-bottom:1px solid var(--line);
    display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:1 0 auto;background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;
    border-radius:0;padding:11px 14px;font-weight:600;font-size:14px;white-space:nowrap}
  nav.tabs button[aria-selected=true]{color:var(--gold);border-bottom-color:var(--gold)}
  section.tab{padding-top:6px}

  /* ---- overview ---- */
  .hero{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;padding:18px 0 4px}
  .odds{font-family:"Iowan Old Style",Georgia,serif;font-size:64px;line-height:.9;color:var(--gold)}
  .odds small{font-size:24px;opacity:.7}
  .heroLab{max-width:360px;color:var(--muted);font-size:13.5px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .stat b{display:block;font-size:22px;font-weight:600}
  .stat span{color:var(--muted);font-size:12px}

  /* ---- bracket ---- */
  .br{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin-top:4px}
  @media (max-width:640px){ .br{grid-template-columns:1fr} }
  .br h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .br .m{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin-bottom:8px}
  .br .m .vs{color:var(--muted);font-size:11.5px;text-align:center;padding:1px 0}
  .br .t{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
  .br .t .sd{color:var(--gold);font-weight:700;width:22px;text-align:right;font-variant-numeric:tabular-nums}
  .br .t .nm{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .br .t .nm.me{color:var(--gold)}
  .br .t .tag{font-size:11px;color:var(--muted);white-space:nowrap}
  .br .t .p{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;width:40px;text-align:right}
  .br .next{font-size:11.5px;color:var(--muted);margin:-2px 0 6px 32px}
  .bubble{margin-top:10px;font-size:13px;color:var(--muted)}
  .bubble b{color:var(--ink);font-weight:600}

  /* ---- game cards ---- */
  .g{padding:12px 0;border-bottom:1px solid var(--line)}
  .g.own{padding:12px 12px;margin:4px 0 8px;border-radius:9px;border:1.5px solid color-mix(in srgb, var(--gold) 70%, transparent)}
  .winpill{display:inline-block;border-radius:6px;padding:1px 7px;font-weight:700;font-size:12.5px;color:var(--ink)}
  .g.dev:not(.own){border-left:3px solid var(--gold);padding-left:10px}
  .g-dev{font-size:12.5px;color:var(--gold);margin-top:3px}
  .g-dev b{color:var(--gold)}
  .g-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:12.5px;color:var(--muted)}
  .g-top .lev{color:var(--ink);font-weight:600;white-space:nowrap}
  .g-top .lev b{color:var(--gold);font-size:15px}
  .g-match{font-size:16px;font-weight:600;margin-top:4px;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
  .g-match em{font-style:normal;color:var(--muted);font-weight:400}
  .rk{color:var(--gold);font-weight:600;font-size:12.5px}
  .g-line{font-size:12.5px;color:var(--muted)}
  .g-line b{color:var(--ink);font-weight:500}
  .chip{display:inline-block;padding:2px 8px;border-radius:6px;border:1.5px solid transparent;margin:0;line-height:1.3}
  .chip:not(.want):not(.mine){padding-left:0;padding-right:0}
  .chip small{color:var(--muted);font-weight:500;font-size:12px}
  .chip.want{border-color:var(--for)}
  .chip.mine{border-color:var(--gold)}
  .g-top .lev{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .g-top .lev.why{cursor:pointer}
  .g-top .lev.why:hover .pill{outline:1.5px solid var(--gold)}
  .sheet .why-list{margin:6px 0 0;padding-left:0;list-style:none}
  .sheet .why-list li{padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .sheet .why-list li b{color:var(--ink)}
  .sheet .why-list li .p{color:var(--muted);font-variant-numeric:tabular-nums}
  .sheet .team-ctx{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  @media (max-width:560px){ .sheet .team-ctx{grid-template-columns:1fr} }
  .sheet .team-ctx > div{background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
  .sheet .team-ctx b{color:var(--ink)}
  .pill{display:inline-block;border-radius:6px;padding:1px 8px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:38px;text-align:center}
  .pill.dim{color:var(--muted);font-weight:500}
  .g-top .lev small{font-weight:500;color:var(--muted);font-size:11.5px}
  .tn{cursor:pointer;text-decoration:underline dotted color-mix(in srgb, var(--muted) 60%, transparent);text-underline-offset:3px}
  .tn:hover{text-decoration-color:var(--gold)}
  /* team popup */
  .modal{position:fixed;inset:0;z-index:20;background:rgba(3,10,20,.7);display:flex;align-items:flex-end;justify-content:center}
  .modal[hidden]{display:none}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:14px 16px 24px}
  @media (min-width:640px){ .modal{align-items:center} .sheet{border-radius:14px;max-height:85vh} }
  .sheet h2{margin:0 0 2px;font-size:20px}
  .sheet h3{margin:16px 0 6px}
  .sheet .close{position:sticky;top:0;float:right;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;padding:0;font-size:18px;line-height:1}
  .sheet .kv{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 6px;font-size:13px;color:var(--muted)}
  .sheet .kv b{color:var(--ink);font-weight:600}
  .sheet table{font-size:13px}
  .sheet td.r2{text-align:right}
  .g-odds{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:13.5px}
  .g-odds span{color:var(--muted)}
  .g-odds b{font-weight:600}
  .g-odds .want b{color:var(--for)}
  .g-odds .want span{color:var(--ink)}
  .slate-div{display:flex;align-items:center;gap:10px;margin:18px 0 4px;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .slate-div::after{content:"";flex:1;height:2px;background:var(--line)}
  a.tolink{color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:2px}
  .slate-div.pulse{margin-top:6px} .slate-div.pulse .dot{margin:0 4px 0 2px}
  .slate-div.live{color:var(--against)} .slate-div.live::after{background:color-mix(in srgb, var(--against) 45%, var(--line))}
  .g.thisweek{border-left:3px solid var(--gold);padding-left:10px}
  .wkrow{display:flex;gap:4px;margin:4px 0 0;flex-wrap:nowrap;align-items:center;min-height:14px;white-space:nowrap}
  .g-top>div:first-child{min-width:0}
  @media (max-width:480px){ .wkrow{gap:2.5px} .wkrow span{width:8px;height:8px} .wkrow span.on{width:10px;height:10px} .wkrow small{font-size:10px} }
  .wkrow span{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--muted);box-sizing:border-box;font-size:0;color:transparent;opacity:.6}
  .wkrow span.now{opacity:1;border-color:var(--gold)}
  .wkrow span.on{background:var(--gold);border-color:var(--gold);opacity:1;width:13px;height:13px}
  .wkrow span::after{content:none}
  .wktag{display:inline-block;background:var(--gold);color:#fff;font-weight:700;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-right:2px}
  body.light .wktag{color:#fff}
  .g-verdict{font-size:13px;margin-top:5px;color:var(--muted)}
  .g-verdict strong{color:var(--for)}
  .g-verdict.mine strong{color:var(--gold)}
  .g-verdict.flat{color:var(--muted)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden} .seg[hidden]{display:none}
  .seg button{background:var(--panel2);color:var(--muted);border:0;border-radius:0;padding:6px 11px;font-size:13px;font-weight:500}
  .seg button[aria-pressed=true]{background:var(--gold);color:#10233a;font-weight:650}
  details.quiet{margin-top:12px;color:var(--muted);font-size:13px}
  details.quiet summary{cursor:pointer}

  /* ---- tables ---- */
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* the Top 25 board always sits on a neutral ground so the green/red shading reads the same for every team */
  /* full-bleed on every screen size; on phones the table runs edge to edge */
  #tab-board{--fieldhue:#3fa96b;background:var(--field);border-radius:0;padding:6px 0 14px;margin:10px calc(50% - 50vw) 0;width:100vw}
  #tab-board > h2, #tab-board > .explain, #tab-board > .controls{margin-left:14px;margin-right:14px}
  #tab-board .scroll{margin:0;padding:0;width:auto}
  #rankings td.k{padding-left:8px}
  body:not(.light) #tab-board{--field:#13161b;--panel:#1a1e24;--panel2:#242a32;--line:#2e353e;--muted:#9aa4ae}
  @media (min-width:1100px){ #tab-board{padding:6px 16px 16px} #tab-board > h2, #tab-board > .explain, #tab-board > .controls{margin-left:0;margin-right:0} }
  /* light (no-team) theme: the board goes light too, and shaded cells use dark text */
  body.light #tab-board{--field:#f7f9fc;--panel:#eef2f7;--panel2:#e0e7f0;--line:#c9d3df;--muted:#4f6079}
  body.light .cell.hot small{color:#10233a;opacity:.8}
  body.light .modal{background:rgba(16,35,58,.45)}
  body.light #run, body.light .seg button[aria-pressed=true], body.light .tabs button[aria-pressed=true]{color:#fff}
  body.light .tabs button{color:var(--muted)} body.light .tabs button[aria-selected=true]{color:var(--gold)}
  body.light .info{color:var(--gold)} body.light .info[aria-expanded=true]{color:#fff}
  body.light .sheet .close{color:var(--ink)}
  body.light .g.own{color:var(--ink)}
  /* overview: bracket and blockers sit side by side when there's room */
  @media (min-width:1100px){
    .ov2{display:grid;grid-template-columns:1fr 1fr;gap:12px 32px;align-items:start;
      width:min(100vw,1500px);margin-left:calc(50% - min(50vw,750px));padding:0 16px}
    .ov2 .col{min-width:0}
  }
  th,td{padding:6px 7px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:11.5px;position:sticky;top:0;background:var(--field)}
  td.k{position:sticky;left:0;background:var(--field);font-weight:600;min-width:104px;z-index:1;box-shadow:2px 0 0 var(--line)}
  td.r{color:var(--muted);text-align:center;width:36px}
  td.r b{color:var(--gold);font-weight:600}
  th.c{text-align:center}
  .cell{border-radius:5px;padding:3px 6px;display:block;line-height:1.25;min-width:64px;color:var(--ink)}
  .cell[data-game], .whycell{cursor:pointer}
  .whycell:hover .pill{outline:1.5px solid var(--gold)}
  .cell[data-game]:hover{outline:1.5px solid var(--gold)}
  .cell small{display:block;color:var(--muted);font-size:11px}
  .plain{font-size:14.5px;line-height:1.55}
  .plain p{margin:0 0 10px}
  .plain .big{font-size:18px;font-weight:600;color:var(--ink);margin:6px 0 10px}
  .plain .big.for{color:var(--for)} .plain .big.mine{color:var(--gold)}
  .plain .scores{display:flex;gap:16px;margin:0 0 12px;color:var(--muted);font-size:13px;align-items:center}
  .cell.hot small{color:#e9eef5;opacity:.85}
  .cell small.tv{font-size:10px;opacity:.75;white-space:nowrap}
  .cell.w small{color:var(--for)} .cell.l small{color:var(--against)}
  .cell.done{background:var(--panel2)!important;border:1px solid var(--line);color:var(--muted)}
  .cell.done small.num{font-weight:700;font-size:11.5px}
  .cell.done.w small.num{color:var(--for)} .cell.done.l small.num{color:var(--against)}
  .cell small.real{font-weight:700;font-size:11px;opacity:1} .cell small.real.good{color:var(--for)} .cell small.real.bad{color:var(--against)} .cell small.real.field{color:var(--gold)} .cell small.real.soft{opacity:.55} .cell small.real.zero{color:var(--muted);font-weight:600}
  .chip.against{border-color:var(--against)}
  .plain .big.bad{color:var(--against)}
  .good{color:var(--for)} .bad{color:var(--against)}
  .g-top .lev small.good b, .scores .good b, .g-line b.good, .chip b.good{color:var(--for)} .g-top .lev small.bad b, .scores .bad b, .g-line b.bad, .chip b.bad{color:var(--against)}
  .g-top .lev small.good, .scores .good{color:var(--for)} .g-top .lev small.bad, .scores .bad{color:var(--against)}
  .g.played .g-match .chip b{margin-left:2px}
  td.multi .cell+.cell{margin-top:3px}
  .cell.live{outline:1.5px solid var(--against);outline-offset:-1.5px}
  .cell.live small.tv{color:var(--against);font-weight:700;opacity:1}
  .cell.live small.num{font-weight:600}
  .cell.h2h{border:1.5px solid var(--gold);color:var(--gold);background:transparent}
  .cell.h2h small{color:var(--gold);opacity:.8}
  tr.me td.k, td.me{color:var(--gold)}
  #rankings tr.me td{border-bottom:3px solid var(--gold);padding-bottom:9px}
  #rankings tr.sep td{height:10px;padding:0;border-bottom:0}
  #rankings th:not(:first-child){text-align:center}
  #rankings tr.sum td:not(.k){text-align:center}
  #rankings tr.sum td{padding-top:6px;padding-bottom:8px;vertical-align:middle;border-bottom:2px solid var(--line)}
  .pair{display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
  .sumlab{cursor:pointer;white-space:nowrap} .sumlab i{display:inline-block;width:14px;height:14px;line-height:12px;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);font-size:10px;font-style:normal;font-weight:700;text-align:center;margin-left:3px;vertical-align:1px}
  .net{font-weight:700;font-size:13px} .net.zero{color:var(--muted)}
  #rankings tr.sum td.k{font-weight:600;color:var(--muted)}
  #rankings tr.sep.lab td{height:auto;padding:10px 6px 4px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
  .cell.own{border:1px solid color-mix(in srgb, var(--gold) 45%, transparent)}
  .ramp{display:block;border-radius:5px;padding:3px 7px;text-align:center;font-weight:700;color:var(--ink)}
  td.pc{width:118px}
  button{color:#10233a}
  .legend{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin:0 0 8px;font-size:12.5px;color:var(--muted)}

<script>
const $ = s => document.querySelector(s);
let D=null, T=null, RES=null;
// per-device preferences (team, season count, lines toggle, last tab)
const pref = { get(k){ try{ return localStorage.getItem("lb."+k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem("lb."+k, v); }catch(e){} } };
const UI = { tab:"overview", slateWeek:null, slateSort:"lev", slateView:"up", slateRanked:false, slateMin:10, seasonSort:"lev", seasonView:"up", seasonMin:25, boardSort:"rank", boardMin:0.10 };

const norm = z => { // standard normal CDF
  const t = 1/(1+0.2316419*Math.abs(z));
  const d = 0.3989422804014327*Math.exp(-z*z/2);
  let p = d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>0 ? 1-p : p;
};
const pct = x => (x*100).toFixed(1);
const short = n => ({"Notre Dame":"Notre Dame","Ohio State":"Ohio St","Michigan State":"Mich St","Mississippi State":"Miss St","Washington State":"Wash St","Oklahoma State":"Okla St","Iowa State":"Iowa St","Arizona State":"Ariz St","Kansas State":"K State","Penn State":"Penn St","Florida State":"Fla St","Boise State":"Boise St","North Carolina":"UNC","South Carolina":"S Carolina","Texas A&M":"Texas A&M","Appalachian State":"App State","Fresno State":"Fresno St","Florida Atlantic":"FAU","Florida International":"FIU","Jacksonville State":"Jax State","Kennesaw State":"Kennesaw","Colorado State":"Colorado St","San Diego State":"SDSU","San José State":"SJSU","Oregon State":"Oregon St","Georgia Southern":"Ga Southern","Georgia State":"Ga State","Middle Tennessee":"MTSU","Northern Illinois":"NIU","New Mexico State":"NM State","Eastern Michigan":"E Michigan","Western Michigan":"W Michigan","Central Michigan":"C Michigan","Coastal Carolina":"Coastal","Southern Miss":"So Miss","Virginia Tech":"Va Tech","Arkansas State":"Ark State","Texas State":"Texas St","Utah State":"Utah St","Massachusetts":"UMass","North Dakota State":"NDSU","Sacramento State":"Sac State","Old Dominion":"ODU","South Florida":"USF","South Alabama":"S Alabama","West Virginia":"W Virginia","James Madison":"JMU","Bowling Green":"Bowling Grn","Kansas State":"Kansas St","Sam Houston":"Sam Houston","Western Kentucky":"W Kentucky","Georgia Tech":"Ga Tech","Boston College":"Boston Col","Louisiana Tech":"La Tech","Missouri State":"Missouri St","Northwestern":"N'western"}[n] || (n.length>11 ? n.slice(0,10)+"…" : n));

// Which poll drives the "#n" badges: the committee once it exists, otherwise AP.
const useCfp = () => !!(D.polls && D.polls.cfp);
const rankOf = team => { const t=D.teams[idx.get(team)]; if(!t) return null; return useCfp() ? (t.cfpRank||null) : (t.apRank||null); };
const isRanked = team => { const t=D.teams[idx.get(team)]; return !!(t && (t.apRank||t.cfpRank)); };
const isFcs = team => !!(D.teams[idx.get(team)]||{}).fcs;
const tn = (team, label) => `<span class="tn" data-team="${team.replace(/"/g,"&quot;")}">${label??team}</span>`;
const badge = team => { const r=rankOf(team); return r ? `<span class="rk">#${r}</span> ${tn(team)}` : (isFcs(team) ? `${tn(team)} <span class="rk" style="color:var(--muted)">FCS</span>` : tn(team)); };
const fmtKick = g => {
  if(!g.start) return "";
  const d=new Date(g.start); if(isNaN(d)) return "";
  const day=d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  if(g.tbd) return `${day} · TBD`;
  return `${day} · ${hhmm(d)}`;
};
// kickoff as a 24-hour clock in local time: 1330
const hhmm = d => String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");
// compact kickoff for board cells: "Sat 1530 · ABC"
const fmtKickShort = g => {
  if(!g.start) return "";
  const d=new Date(g.start); if(isNaN(d)) return "";
  const day=d.toLocaleDateString(undefined,{weekday:"short"});
  return `${day} ${g.tbd?"TBD":hhmm(d)}${g.tv?" · "+g.tv:""}`;
};
const fmtWin = p => p<0.005?"<1":p>0.995?">99":Math.round(p*100);

// ---------- team colour palette ----------
// The accent (--gold) becomes the school colour with the better contrast on the dark ground, lightened if needed;
// the ground itself takes a tint of the other colour. Rooting green/red stay fixed so they keep their meaning.
const hexRgb = x => { const m=/^#?([0-9a-f]{6})$/i.exec(String(x||"").trim()); if(!m) return null; const n=parseInt(m[1],16); return [n>>16&255,n>>8&255,n&255]; };
const lum = ([r,g,b]) => { const f=c=>{ c/=255; return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4); }; return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b); };
const contrast = (a,b) => { const la=lum(a), lb=lum(b); return (Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05); };
const mixRgb = (a,b,t) => a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const css = ([r,g,b]) => `rgb(${r},${g},${b})`;
const BASE_FIELD=[8,24,43];
function applyTheme(team){
  const root=document.documentElement.style;
  const clear=()=>{ ["--gold","--field","--panel","--panel2","--line","--muted","--ink","--flat"].forEach(k=>root.removeProperty(k)); document.body.classList.add("light"); document.querySelector('meta[name="theme-color"]').content="#0c2340"; };
  const tm=team && D ? D.teams[idx.get(team)] : null;
  const on=$("#teamColors").checked;
  const setAll=(field,accent)=>{
    root.setProperty("--field", css(field));
    root.setProperty("--panel", css(mixRgb(field,[255,255,255],0.05)));
    root.setProperty("--panel2", css(mixRgb(field,[255,255,255],0.10)));
    root.setProperty("--line", css(mixRgb(field,[255,255,255],0.16)));
    root.setProperty("--muted", css(mixRgb(field,[255,255,255],0.58)));
    root.setProperty("--gold", css(accent));
    document.querySelector('meta[name="theme-color"]').content=css(mixRgb(field,[255,255,255],0.05));
  };
  // no team: plain light theme (white ground, dark text, slate accent) so no school's colours are implied
  if(team==="" || !on || !tm || (!tm.color && !tm.altColor)){ clear(); return; }
  const cols=[tm.color,tm.altColor].map(hexRgb).filter(Boolean);
  if(!cols.length){ clear(); return; }
  document.body.classList.remove("light");
  root.setProperty("--ink","#e9eef5"); root.setProperty("--flat","#2b4a6d");
  // ground: navy tinted toward the darker school colour
  const dark = cols.slice().sort((a,b)=>lum(a)-lum(b))[0];
  const field = mixRgb(BASE_FIELD, dark, 0.35);
  // accent: a school colour that reads on that ground without being white or a washed-out version of the ground.
  // If the school only has one colour, or neither works, keep the default gold.
  const GOLD=[201,164,76];
  let accent=null;
  const tryCol = c => { if(!c || c===dark && cols.length>1) return null; let x=c; for(let i=0;i<4 && contrast(x,field)<4.5;i++) x=mixRgb(x,[255,255,255],0.15); if(contrast(x,field)<4.5) return null; if(lum(x)>0.75) return null; return x; };
  const others = cols.filter(c=>c!==dark);
  for(const c of others){ accent=tryCol(c); if(accent) break; }
  // single-colour school (or an alternate that doesn't read): lighten the school's own colour until it does
  if(!accent){ let x=dark; for(let i=0;i<8 && contrast(x,field)<4.5;i++) x=mixRgb(x,[255,255,255],0.18); accent=x; }
  setAll(field, accent);
}
$("#teamColors").onchange=()=>{ pref.set("teamColors",$("#teamColors").checked?"1":"0"); applyTheme(T); };

// ---------- load ----------
fetch("data.json?v="+Date.now(), {cache:"no-store"}).then(r=>r.json()).then(d=>{
  D = d; build();
  const pollBits=[];
  if(d.polls && d.polls.ap) pollBits.push(`AP wk ${d.polls.ap.week}`);
  if(d.polls && d.polls.cfp) pollBits.push(`CFP wk ${d.polls.cfp.week}`);
  $("#stamp").textContent = `${d.season} season · updated ${new Date(d.updatedAt).toLocaleDateString()}`
    + (pollBits.length?` · ${pollBits.join(" · ")}`:"") + (d.meta&&d.meta.ratings?` · ${d.meta.ratings}`:"") + (d.source==="placeholder" ? " · PLACEHOLDER DATA" : "");
  const sel = $("#team");
  { const o=document.createElement("option"); o.value=""; o.textContent="— No team (whole playoff field)"; sel.appendChild(o); }
  d.teams.filter(t=>!t.fcs).sort((a,b)=>(rankOf(a.team)||99)-(rankOf(b.team)||99) || a.team.localeCompare(b.team))
    .forEach(t=>{ const o=document.createElement("option"); o.value=t.team; const r=rankOf(t.team); o.textContent=(r?`#${r} `:"")+t.team; sel.appendChild(o); });
  const saved = pref.get("team");
  sel.value = saved==="" ? "" : (saved && d.teams.some(t=>t.team===saved)) ? saved : d.teams.some(t=>t.team==="Notre Dame") ? "Notre Dame" : d.teams[0].team;
  const phone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (matchMedia("(pointer:coarse)").matches && innerWidth<900);
  $("#sims").value = phone ? "10000" : "25000";
  const sims = pref.get("sims"); if(sims && [...$("#sims").options].some(o=>o.value===sims)) $("#sims").value = sims;
  const tc = pref.get("teamColors"); if(tc!==null) $("#teamColors").checked = tc==="1";
  const smin = pref.get("slateMin"); if(smin!==null && [...$("#slateMin").options].some(o=>o.value===smin)){ $("#slateMin").value=smin; UI.slateMin=+smin; }
  const bs = pref.get("boardSort"); if(bs==="rank"||bs==="pIn") UI.boardSort=bs;
  const bm = pref.get("boardMin"); if(bm!==null && [...$("#boardMin").options].some(o=>o.value===bm)){ $("#boardMin").value=bm; UI.boardMin=+bm; }
  const slv = pref.get("slateView"); if(slv==="up"||slv==="played") UI.slateView=slv;
  const sv = pref.get("seasonView"); if(sv==="up"||sv==="played") UI.seasonView=sv;
  const nmin = pref.get("seasonMin"); if(nmin!==null && [...$("#seasonMin").options].some(o=>o.value===nmin)){ $("#seasonMin").value=nmin; UI.seasonMin=+nmin; }
  const tab = pref.get("tab"); if(tab && document.querySelector(`#tabs button[data-tab="${tab}"]`)) showTab(tab);
  // finals from ESPN first (a few seconds at most), then the first simulation, then live polling if it's on
  const go=()=>{ run(); if(window.liveStart && $("#liveOn").checked) window.liveStart(); };
  if(window.liveSync) window.liveSync().then(go, go); else go();
}).catch(e=>{ $("#stamp").textContent="Couldn't load data.json — run scripts/fetch-data.mjs first."; });

// ---------- precompute ----------
let idx, rating, confOf, tierOf, confList, P4=["ACC","Big Ten","Big 12","SEC"];
let gH,gA,gP,gPsp,gPline,gConf,gDone,gRes,gWeek,gLine,gHfa,nG,nT;
let confIdx, members, isP4, teamGames, gamesPerTeam;
// CFBD labels the opening weekend (Aug 29-30) as week 1 along with the Labor Day weekend. Split week 1 by
// Tuesday-to-Monday window: if it spans two, the earlier window becomes week 0.
function splitWeekZero(){
  const win=g=>{ const d=new Date(g.start); const back=(d.getUTCDay()+5)%7; return Math.floor((d.getTime()-back*864e5)/864e5); };
  const wk1=D.games.filter(g=>g.week===1 && g.start);
  const wins=[...new Set(wk1.map(win))].sort((a,b)=>a-b);
  if(wins.length<2) return;
  wk1.forEach(g=>{ if(win(g)===wins[0]) g.week=0; });
}
function build(){
  if(window.applyLive) window.applyLive();
  splitWeekZero();
  nT = D.teams.length;
  idx = new Map(D.teams.map((t,i)=>[t.team,i]));
  rating = Float64Array.from(D.teams.map(t=>t.rating));
  confOf = D.teams.map(t=>t.conference);
  tierOf = D.conferenceTiers;
  confList = [...new Set(confOf)].filter(c=>tierOf[c]!=="IND" && tierOf[c]!=="FCS");
  confIdx = new Int32Array(nT).fill(-1);
  members = confList.map(()=>[]);
  confList.forEach((c,k)=>{ for(let i=0;i<nT;i++) if(confOf[i]===c){ confIdx[i]=k; members[k].push(i); } });
  isP4 = confList.map(c=>P4.includes(c));
  const g = D.games; nG = g.length;
  gH=new Int32Array(nG); gA=new Int32Array(nG); gP=new Float64Array(nG); gPsp=new Float64Array(nG); gPline=new Float64Array(nG).fill(NaN); gLine=new Uint8Array(nG); gHfa=new Float64Array(nG);
  gConf=new Uint8Array(nG); gDone=new Uint8Array(nG); gRes=new Uint8Array(nG); gWeek=new Int32Array(nG);
  const {hfa,sdMargin}=D.config, spreadSd=D.config.spreadSd||13.5;
  const useLines = false;
  const tg = D.teams.map(()=>[]);
  g.forEach((x,i)=>{
    gH[i]=idx.get(x.home); gA[i]=idx.get(x.away); gWeek[i]=x.week;
    gConf[i]=x.conferenceGame?1:0; gDone[i]=x.completed?1:0; gRes[i]=x.homeWin?1:0; gHfa[i]=x.neutral?0:hfa;
    tg[gH[i]].push(i); tg[gA[i]].push(i);
    gPsp[i]=norm(((rating[gH[i]]-rating[gA[i]])+gHfa[i])/sdMargin);
    if(typeof x.spread==="number" && isFinite(x.spread)) gPline[i]=norm(-x.spread/spreadSd); // spread is home-perspective, negative = home favoured
    if(useLines && !isNaN(gPline[i])){ gP[i]=gPline[i]; gLine[i]=1; } else gP[i]=gPsp[i];
    // a game in progress: pregame SP+ edge, current margin and time left give a live win probability
    if(x.live && !x.completed && window.inGameP){
      const f=Math.max(0.02, Math.min(1, (x.live.period>=5 ? 0.02 : ((4-Math.max(1,x.live.period))*900 + (/^(d+):(dd)$/.test(x.live.clock)?(+RegExp.$1)*60+(+RegExp.$2):0))/3600)));
      gP[i]=window.inGameP((rating[gH[i]]-rating[gA[i]])+gHfa[i], x.live.hs-x.live.as, f, sdMargin); gLine[i]=0;
    }
  });
  teamGames = tg.map(a=>Int32Array.from(a));
  gamesPerTeam = Int32Array.from(tg.map(a=>a.length));
}

// ---------- simulation ----------
// Each simulated season is played out once, then every remaining game is flipped in place and the
// target's fate is re-evaluated with everything else held fixed. That paired comparison is what makes
// a game's leverage precise: a 25-point favourite's game contributes exactly zero unless flipping it
// actually changes the target's outcome.
//
// Committee stand-in: true strength (rating + per-season noise) plus a résumé built from opponents'
// FINAL records. Beating a team is worth more the more games that team ends up winning; losing costs a
// flat penalty plus more the worse the opponent turns out. So your opponents' other games matter to you.
// The season loop lives in sim.js. N seasons are split into fixed shards with fixed seeds, so the answer for a
// given N is the same on every device; the shards run in parallel Web Workers (one per core) when the browser has
// them, otherwise inline in timed chunks. The page keeps its worker pool between runs.
const SIM = { pool:[], token:0 };
function simParams(){
  return { nT,nG,gH,gA,gP,gLine,gDone,gRes,gConf,gHfa,rating,teamGames,members,confIdx,isP4,confList,config:D.config };
}
function simulate(target, N, onProgress, done){
  const ti = target ? idx.get(target) : -1;
  const P = simParams(), list = SimCore.shards(N), token = ++SIM.token;
  const canWork = typeof Worker!=="undefined" && typeof location!=="undefined" && location.protocol!=="file:";
  if(!canWork){ simulateInline(P, ti, N, list, onProgress, done); return; }
  const k = Math.max(1, Math.min(list.length, navigator.hardwareConcurrency||2, 8));
  // a run still in flight is abandoned: drop its workers rather than let them keep burning CPU
  if(SIM.busy){ SIM.pool.forEach(w=>w.terminate()); SIM.pool=[]; }
  while(SIM.pool.length<k){ try{ SIM.pool.push(new Worker("sim.js")); }catch(e){ break; } }
  if(!SIM.pool.length){ simulateInline(P, ti, N, list, onProgress, done); return; }
  const workers=SIM.pool.slice(0,k), jobs=workers.map(()=>[]);
  list.forEach((sh,i)=>jobs[i%workers.length].push(sh));
  const prog=new Array(workers.length).fill(0); let left=workers.filter((w,i)=>jobs[i].length).length;
  const acc=SimCore.newAcc(nT,nG,ti<0); let failed=false;
  SIM.busy=true;
  workers.forEach((w,i)=>{
    if(!jobs[i].length) return;
    w.onmessage=e=>{ const m=e.data; if(m.token!==token) return;
      prog[i]=m.done; onProgress(Math.min(1, prog.reduce((x,y)=>x+y,0)/N));
      if(m.type==="done"){ SimCore.mergeAcc(acc, m.acc); if(--left===0){ SIM.busy=false; done(finish(acc,N,ti)); } } };
    w.onerror=e=>{ if(failed) return; failed=true; SIM.busy=false; SIM.pool.forEach(x=>x.terminate()); SIM.pool=[];
      console.warn("simulation worker failed, running inline", e.message||e); simulateInline(P, ti, N, list, onProgress, done); };
    w.postMessage({P, ti, shards:jobs[i], token});
  });
}
// no workers (old browsers, file:// pages, the headless harness): the same shards, one after another, in timed chunks
function simulateInline(P, ti, N, list, onProgress, done){
  const acc=SimCore.newAcc(nT,nG,ti<0);
  let si=0, sim=null, inShard=0, n=0;
  function chunk(){
    const end=Math.min(N, n+250);
    while(n<end && si<list.length){
      if(!sim){ sim=SimCore.createSim(P, ti, list[si].seed, acc); inShard=0; }
      sim.season(); n++; inShard++;
      if(inShard>=list[si].n){ si++; sim=null; }
    }
    onProgress(n/N);
    if(n<N && si<list.length) setTimeout(chunk,0); else done(finish(acc,N,ti));
  }
  chunk();
}

// Normalise to 0-100 on two separate scales: other teams' games against the biggest of those,
// and the target's own games against the biggest game on its own schedule.
// Played games are scored on the same scale as the games still to come, so a finished result reads like an upcoming one.
function normalizeGames(games, played){
  const ext=games.filter(g=>g.clear&&!g.involvesMe), own=games.filter(g=>g.clear&&g.involvesMe);
  const levMax=Math.max(1e-6,...ext.map(g=>g.lev)), impMax=Math.max(1e-6,...ext.map(g=>Math.abs(g.swing)));
  const ownLevMax=Math.max(1e-6,...own.map(g=>g.lev)), ownImpMax=Math.max(1e-6,...own.map(g=>Math.abs(g.swing)));
  const apply=g=>{
    const lm=g.involvesMe?ownLevMax:levMax, im=g.involvesMe?ownImpMax:impMax;
    const mag = g.done ? Math.abs(g.realized) : Math.abs(g.swing);
    g.levN=Math.min(100,g.lev/lm*100); g.impN=Math.min(100,mag/im*100);
  };
  games.forEach(apply); (played||[]).forEach(apply);
}
// Live reruns are nearly the same model with slightly different inputs, so each new run is blended 50/50 with the
// previous one. That halves the run-to-run noise on games in the middle of the list without hiding real moves.
function smoothWithPrevious(r, prev){
  if(!prev || prev.mode!==r.mode || prev.forTeam!==r.forTeam || prev.N!==r.N) return r;
  const old=new Map(prev.games.map(g=>[g.i,g]));
  r.games.forEach(g=>{
    const o=old.get(g.i); if(!o || !!o.live!==!!g.live) return;   // a game that just started or ended is taken fresh
    g.swing=0.5*(o.swing+g.swing); g.lev=0.5*(o.lev+g.lev);
    if(o.pH!=null&&g.pH!=null){ g.pH=0.5*(o.pH+g.pH); g.pA=0.5*(o.pA+g.pA); }
    g.pDecides=0.5*(o.pDecides+g.pDecides);
    g.se=Math.sqrt((o.se*o.se+g.se*g.se)/4);
    g.clear=Math.abs(g.swing)>=0.001; g.sure=Math.abs(g.swing)>=2*g.se;
  });
  normalizeGames(r.games);
  r.smoothed=(prev.smoothed||0)+1;
  return r;
}
function finish(acc,N,ti){
  const games=[], played=[];
  for(let i=0;i<nG;i++){
    const src=D.games[i];
    const out = gDone[i] ? played : games;
    const fin = { done:!!gDone[i], homeWin:gRes[i]===1, homeScore:src.homeScore??null, awayScore:src.awayScore??null };
    if(ti<0){
      const p=gP[i], chg=acc.fieldChg[i]/N, se=Math.sqrt(chg*(1-chg)/N);
      const top=[]; if(acc.fieldChg[i]>0){ for(let j=0;j<nT;j++){ const c=acc.teamFlip[i*nT+j]; if(c>0) top.push({team:D.teams[j].team, share:c/acc.fieldChg[i]}); } top.sort((a,b)=>b.share-a.share); }
      out.push({...fin,i,week:gWeek[i],home:src.home,away:src.away,start:src.start||null,tbd:!!src.tbd,tv:src.tv||null,
        spread:src.spread??null,spreadText:src.spreadText||"",overUnder:src.overUnder??null,
        pHomeWin:p, pSp:gPsp[i], pLine:isNaN(gPline[i])?null:gPline[i], line:!!gLine[i], involvesMe:false, live:src.live||null,
        pH:null,pA:null, swing:chg, se, clear: chg>=0.001, sure: chg>=2*se, pDecides:chg, why:null,
        swapsAvg: acc.fieldChg[i]?acc.fieldSwaps[i]/acc.fieldChg[i]:0, fieldTop: top.slice(0,3),
        lev: chg*100 * 4*p*(1-p)});
      continue;
    }
    const pH=acc.sumH[i]/N, pA=acc.sumA[i]/N, swing=acc.sumD[i]/N;
    const varD=Math.max(0, acc.sumD2[i]/N - swing*swing);
    const se=Math.sqrt(varD/N);
    const p=gP[i];
    const nDiff=acc.sumD2[i]; // seasons where this result decided the target's fate
    const why = nDiff ? {resume:acc.why[0][i]/nDiff, autobid:acc.why[1][i]/nDiff, rank:acc.why[2][i]/nDiff} : null;
    out.push({...fin,i,week:gWeek[i],home:src.home,away:src.away,start:src.start||null,tbd:!!src.tbd,tv:src.tv||null,
      spread:src.spread??null,spreadText:src.spreadText||"",overUnder:src.overUnder??null,
      pHomeWin:p, pSp:gPsp[i], pLine:isNaN(gPline[i])?null:gPline[i], line:!!gLine[i], involvesMe: gH[i]===ti||gA[i]===ti, live:src.live||null,
      pH,pA,swing,se, clear: Math.abs(swing)>=0.001, sure: Math.abs(swing)>=2*se, pDecides:nDiff/N, why,
      // Leverage score: impact weighted by how uncertain the game is. A coin flip keeps its full impact;
      // a 97/3 game keeps about 12% of it, because the outcome you want almost never happens.
      lev: Math.abs(swing)*100 * 4*p*(1-p)});
  }
  // Realised effect of a finished game: how far the result moved the target's odds from where they stood at kickoff,
  // weighing both possible results by their pregame chance. An expected win barely moves the odds; an upset moves them
  // by nearly the whole counterfactual swing. (No-team mode: the field-change rate weighted by how unexpected the result was.)
  played.forEach(g=>{
    const pAct = g.homeWin ? g.pSp : 1-g.pSp;               // pregame chance of the result that happened
    if(ti<0){ g.pBefore=null; g.realized=(1-pAct)*g.swing; g.se=(1-pAct)*g.se; }
    else { g.pBefore = g.pSp*g.pH + (1-g.pSp)*g.pA; g.realized = (g.homeWin?g.pH:g.pA) - g.pBefore; g.se=(1-pAct)*g.se; }
    g.clear = Math.abs(g.realized)>=0.001; g.sure = Math.abs(g.realized)>=2*g.se;
  });
  normalizeGames(games, played);
  let med=1,cum=0; for(let r=1;r<acc.ranks.length;r++){cum+=acc.ranks[r]; if(cum>=N/2){med=r;break;}}
  const teamStats=D.teams.map((t,i)=>({team:t.team,conf:t.conference,fcs:!!t.fcs,
    block:acc.blockers[i]/N, ahead:acc.aheadN[i]/N, wins:acc.teamWins[i]/N, games:gamesPerTeam[i],
    pIn:acc.fieldN[i]/N, pTitle:acc.titleN[i]/N, avgSeed:acc.fieldN[i]?acc.seedSum[i]/acc.fieldN[i]:99, pP4Champ:acc.p4ChampN[i]/N, pG6:acc.g6N[i]/N}));
  return { mode: ti<0?"field":"team", forTeam:T, pIn:acc.in/N, pChamp:acc.champ/N, medRank:med, avgBlock:acc.blockSum/N,
           avgWins:acc.winSum/N, myGames:ti>=0?gamesPerTeam[ti]:0, games, played, teamStats, N };
}

// The same facts, in plain language, for the board
// Why a result matters to the selected team, in plain language. Shared by the upcoming and played popups.
function reasonParts(g,want,other){
  const st=name=>RES.teamStats.find(x=>x.team===name);
  const myGames=D.games.filter(x=>x.home===T||x.away===T);
  const onSched=name=>myGames.find(x=>x.home===name||x.away===name);
  const parts=[];
  if(g.why){
    const list=[["rank",g.why.rank],["autobid",g.why.autobid],["resume",g.why.resume]].filter(([,v])=>v>=0.15).sort((a,b)=>b[1]-a[1]);
    const sOther=st(other), sWant=st(want), sched=onSched(want)||onSched(other);
    for(const [k] of list){
      if(k==="rank") parts.push(`<b>${other}</b> is competing with ${T} for an at-large spot. When they lose, they're more likely to finish behind you in the rankings${sOther.block>=0.05?` (right now they block you in ${Math.round(sOther.block*100)}% of seasons)`:""}.`);
      if(k==="autobid") parts.push(`This game affects who wins the ${st(g.home).conf===st(g.away).conf?st(g.home).conf:"conference"}. A conference champion takes an automatic bid instead of an at-large spot, which changes how many at-large spots are left for teams like ${T}.`);
      if(k==="resume"){ const s=onSched(want)?want:other, ss=st(s), gm=onSched(s);
        parts.push(`<b>${s}</b> is on ${T}'s schedule (week ${gm.week}). The better their final record, the more your result against them counts with the committee${ss.wins>=8?`, and they project to about ${Math.round(ss.wins)} wins`:""}.`); }
    }
  }
  return parts;
}
function openWhySimple(g){

    return `<p><span class="livetag">LIVE</span> ${g.live.period>=5?"OT":g.live.period>=1?"Q"+g.live.period+" "+g.live.clock:"starting"}, <b>${g.away} ${g.live.as}, ${g.home} ${g.live.hs}</b>. Win chance since kickoff: ${g.away} ${arrow(1-g.pSp,1-g.pHomeWin)}, ${g.home} ${arrow(g.pSp,g.pHomeWin)}. Leverage below is based on the live chance.</p>`; })();
  const myGames=D.games.filter(x=>x.home===T||x.away===T);

    ? `If <b>${g.home}</b> wins, ${T}'s playoff odds are <b class="num">${pct(g.pH)}%</b>. If <b>${g.away}</b> wins, <b class="num">${pct(g.pA)}%</b>.`
    : `If <b>${g.away}</b> wins, ${T}'s playoff odds are <b class="num">${pct(g.pA)}%</b>. If <b>${g.home}</b> wins, <b class="num">${pct(g.pH)}%</b>.`;
  const favLine = g.involvesMe
    ? (pFav>=0.9 ? `${fav===T?"You're":fav+" is"} a heavy favourite (${fmtWin(pFav)}%), so this game rarely decides anything, which keeps its leverage modest even though losing it would cost a lot.`

    : !T ? (pFav>=0.9 ? `<b>${fav}</b> is a heavy favourite (${fmtWin(pFav)}%), so the result that would shake up the field almost never happens; that's why leverage is low even if impact isn't.` : pFav>=0.65 ? `<b>${fav}</b> is favoured (${fmtWin(pFav)}%), which trims the leverage a little.` : `This one is close to a coin flip (${fav} ${fmtWin(pFav)}%), so nearly all of its impact counts as leverage.`)
    : pFav>=0.9 ? `<b>${fav}</b> is a heavy favourite (${fmtWin(pFav)}%), so the upset you'd need almost never happens. That's why the leverage is low even if the impact isn't.`
    : pFav>=0.65 ? `<b>${fav}</b> is favoured (${fmtWin(pFav)}%), so the result is fairly predictable and that trims the leverage.`
    : `This one is close to a coin flip (${fav} ${fmtWin(pFav)}%), so nearly all of the impact counts as leverage.`;

  let headline, why="";
  if(!T){

    const tops=(g.fieldTop||[]).map(t=>`<b>${t.team}</b> (${Math.round(t.share*100)}%)`);
    why=g.clear ? `<p>Flipping this result changes who makes the 12-team field in <b class="num">${pct(g.swing)}%</b> of simulated seasons${g.swapsAvg>1.5?`, usually moving more than one spot`:""}. The teams most often swapped in or out: ${tops.join(", ")}.</p>`
                : `<p>Across ${RES.N.toLocaleString()} simulated seasons, flipping this result ${Math.abs(g.swing)<0.001?"never":"almost never"} changed the twelve teams in the field.</p>`;

      <div class="plain">${headline}
        <div class="scores"><span>Leverage ${scorePill(g.lev>0?g.levN:null,g.clear)}</span><span>Impact ${scorePill(g.lev>0?g.impN:null,g.clear)}</span></div>
        ${shiftLine}${why}<p>${favLine}</p>

  }

    <div class="plain">
      ${headline}

        return `<p><b>${badge(n)}</b> makes the playoff ${Math.round(s.pIn*100)}% of the time${s.ahead>=0.02?` and finishes ahead of ${short(T)} ${Math.round(s.ahead*100)}% of the time`:""}${s.pP4Champ>=0.05?`, winning the ${s.conf} ${Math.round(s.pP4Champ*100)}% of the time`:""}. ${sc?`On ${short(T)}'s schedule in week ${sc.week}.`:""}</p>`; }).join("")}
    </div>`;

// A finished game: what the result actually did to the selected team's odds
function openWhyPlayed(g){

      : `<p>Across ${RES.N.toLocaleString()} simulated seasons, flipping this result ${Math.abs(g.swing)<0.001?"never":"almost never"} changes the twelve teams in the field.</p>`);
  } else {
    const pActual=g.homeWin?g.pH:g.pA, pOther=g.homeWin?g.pA:g.pH;
    const helped=g.realized>0, cls=helped?"good":"bad";
    const oddsLine=`At kickoff ${T}'s playoff odds stood at <b class="num">${pct(g.pBefore)}%</b>, weighing both possible results. With this one they're <b class="num ${cls}">${pct(pActual)}%</b>${g.clear?`: a <b class="num ${cls}">${ptsTxt}-point</b> ${helped?"gain":"hit"}`:""}. Had ${loser} won, they'd be <b class="num">${pct(pOther)}%</b>.`;

      const won=winner===T;
      headline=`<div class="big ${won?"for":"bad"}">${won?"You won.":"You lost."}</div>`;
      body=opener+`<p>${oddsLine}</p>`+(won&&pWinPre>=0.75?`<p>You were expected to win, so most of that was already in your odds; the loss would have cost you ${cfTxt} points.</p>`:"");
    } else if(!g.clear || !g.sure){
      headline=`<div class="big">${!g.clear?"Didn't move the needle for "+T+".":(helped?"Leaned your way, but it's within the noise.":"Leaned against you, but it's within the noise.")}</div>`;
      body=opener+`<p>${oddsLine}</p>`
        + (!g.clear ? (pWinPre>=0.75 && cf>=0.1 ? `<p>${winner} was expected to win, so the result was already priced in. The upset would have been worth about ${cfTxt} points ${g.swing>0===g.homeWin?"against":"to"} you.</p>` : `<p>Across ${RES.N.toLocaleString()} simulated seasons this result barely changes whether ${T} makes the field.</p>`)
                    : `<p>The margin of error is ±${(2*g.se*100).toFixed(2)}, so the direction isn't settled. More simulated seasons would sharpen it.</p>`);
    } else {
      const want=g.swing>0?g.home:g.away, other=g.swing>0?g.away:g.home;
      headline=`<div class="big ${helped?"for":"bad"}">${helped?"Went your way.":"Went against you."}</div>`;
      const parts=reasonParts(g,want,other);
      body=opener+`<p>${oddsLine} That's ${size(g.impN)} move compared with the games still to be played.</p>`
        + (parts.length ? `<p>${parts.length>1?"Mostly because ":"Because "}${parts[0]}</p>${parts.slice(1).map(p=>`<p>Also: ${p}</p>`).join("")}` : "");
    }
  }
  $("#sheet").innerHTML=`<button class="close" aria-label="Close">×</button>
    <h2>${badge(g.away)} <small class="num ${g.homeWin?"bad":"good"}" style="font-weight:650">${g.awayScore??""}</small> at ${badge(g.home)} <small class="num ${g.homeWin?"good":"bad"}" style="font-weight:650">${g.homeScore??""}</small></h2>
    <div class="kv"><span>wk ${g.week}</span><span>Final</span>${g.start?`<span>${fmtKick(g)}</span>`:""}${g.spreadText?`<span>closed ${g.spreadText}</span>`:""}</div>
    <div class="plain">
      ${headline}
      <div class="scores"><span>Impact ${scorePill(g.clear?g.impN:null,g.sure)}</span>${T&&g.clear?`<span class="${g.realized>0?"good":"bad"}"><b class="num">${g.realized>0?"+":"−"}${ptsTxt}</b> pts for ${short(T)}</span>`:""}</div>
      ${body}
      <h3>The teams</h3>
      ${[g.away,g.home].map(n=>{ const s=st(n); return `<p><b>${badge(n)}</b> makes the playoff ${Math.round(s.pIn*100)}% of the time${T&&s.ahead>=0.02?` and finishes ahead of ${short(T)} ${Math.round(s.ahead*100)}% of the time`:""}${s.pP4Champ>=0.05?`, winning the ${s.conf} ${Math.round(s.pP4Champ*100)}% of the time`:""}.</p>`; }).join("")}
    </div>`;
  $("#modal").hidden=false; document.body.style.overflow="hidden"; $("#sheet").scrollTop=0;
}
function openTeam(name){
  const tm=D.teams[idx.get(name)]; if(!tm) return;

  const sp=tm.sp;
  const unitRow=(lab,u)=> u && u.rating!=null ? `<tr><td>${lab}</td><td class="r2 num">${(+u.rating).toFixed(1)}</td><td class="r2 num sub">${u.rank?"#"+u.rank:""}</td></tr>` : "";
  const spHtml = sp ? `<h3>SP+ by unit${sp.prior?' <span class="sub">(last season, until this year\'s are published)</span>':""}</h3>
      <table><tr><th></th><th class="c">Rating</th><th class="c">Rank</th></tr>
      ${unitRow("Overall",{rating:sp.rating,rank:sp.rank})}${unitRow("Offense",sp.offense)}${unitRow("Defense",sp.defense)}${unitRow("Special teams",sp.specialTeams)}</table>`
    : `<h3>SP+</h3><div class="sub">Overall rating ${tm.rating}. The unit breakdown arrives with the next data refresh.</div>`;
  const games=D.games.map((g,i)=>({g,i})).filter(x=>x.g.home===name||x.g.away===name).sort((a,b)=>a.g.week-b.g.week);
  const levOf=new Map(); if(RES) RES.games.forEach(x=>levOf.set(x.i,x));
  const rows=games.map(({g,i})=>{

// The most likely 12-team field: each Power Four conference's most probable champion, the strongest Group of Six
// champion, then seven at-larges by playoff probability; seeded by average seed when in. Shared with the PDFs.
function projectField(r){
  const st=r.teamStats.filter(t=>!t.fcs);
  const byConf=new Map(); st.forEach(t=>{ if(!byConf.has(t.conf)) byConf.set(t.conf,[]); byConf.get(t.conf).push(t); });
  const field=[], taken=new Set();
  const take=(t,tag)=>{ if(!t||taken.has(t.team)) return; taken.add(t.team); field.push({...t,tag}); };
  for(const c of P4){ const list=byConf.get(c)||[]; take(list.slice().sort((a,b)=>b.pP4Champ-a.pP4Champ)[0], c+" champ"); }
  take(st.slice().sort((a,b)=>b.pG6-a.pG6)[0], "G6 champ");
  st.filter(t=>!taken.has(t.team)).sort((a,b)=>b.pIn-a.pIn).slice(0,D.config.atLargeSlots).forEach(t=>take(t,"at-large"));
  field.sort((a,b)=>a.avgSeed-b.avgSeed);
  field.forEach((t,i)=>t.seed=i+1);
  field.nextOut=st.filter(t=>!taken.has(t.team)).sort((a,b)=>b.pIn-a.pIn).slice(0,4);
  return field;
}
function renderBracket(r){
  const st=r.teamStats.filter(t=>!t.fcs);
  const field=projectField(r);
  const me=T?field.find(t=>t.team===T):null, mine=T?st.find(t=>t.team===T):null;
  const nextOut=field.nextOut;

  $("#bracketExplain").innerHTML = `<p>${T?"":"No team selected, so this is the whole picture. "}The most likely field: each Power Four conference's most probable champion takes its auto-bid, the strongest Group of Six champion takes the fifth, and seven at-larges fill in by playoff probability. Seeds are each team's average seed across the seasons it made the field. Straight seeding: the four highest-ranked teams get byes whether or not they won a conference. The % is each team's overall chance of making the field.</p>`;

  const row=t=>`<div class="t"><span class="sd num">${t.seed}</span><span class="nm ${t.team===T?"me":""}">${tn(t.team)}</span><span class="tag">${t.tag}</span><span class="p">${Math.round(t.pIn*100)}%</span></div>`;
  const S=n=>field[n-1];
  const game=(hi,lo,next)=>`<div class="m">${row(S(lo))}<div class="vs">at</div>${row(S(hi))}</div><div class="next">winner meets #${next} ${short(S(next).team)}</div>`;
  $("#bracket").innerHTML = `<div class="br">
    <div><h3>First round</h3>${game(5,12,4)}${game(8,9,1)}${game(6,11,3)}${game(7,10,2)}</div>
    <div><h3>Byes to the quarterfinals</h3><div class="m">${[1,2,3,4].map(n=>row(S(n))).join("")}</div>
      <h3 style="margin-top:14px">First teams out</h3><div class="m">${nextOut.map(t=>`<div class="t"><span class="sd"></span><span class="nm ${t.team===T?"me":""}">${tn(t.team)}</span><span class="tag">${t.conf}</span><span class="p">${Math.round(t.pIn*100)}%</span></div>`).join("")}</div>
    </div></div>
    <div class="bubble">${!T ? "" : me
      ? `<b>${T}</b> projects as the #${me.seed} seed${me.seed<=4?" with a bye":me.seed<=8?", hosting a first-round game":", on the road in the first round"}. Average seed when in: ${mine.avgSeed.toFixed(1)}.`
      : `<b>${T}</b> is not in the projected field (${Math.round(mine.pIn*100)}% to make it${mine.pIn>0?`, average seed ${mine.avgSeed.toFixed(1)} when in`:""}).`}</div>`;
}

// 0-100 score -> gold pill whose intensity follows the score
const scorePill = (v, ok=true) => { const mix=Math.round(8+Math.pow(Math.max(0,Math.min(100,v||0))/100,0.7)*82); return ok
  ? `<span class="pill" style="background:color-mix(in srgb, var(--pillhue) ${mix}%, transparent);${mix>=65?"color:#fff":""}">${Math.round(v)}</span>`
  : `<span class="pill dim">${v==null?"—":"~"+Math.round(v)}</span>`; };
// percentage ramp with the same intensity curve as the score pills
const ramp = (v,color,max=1) => `background:color-mix(in srgb, ${color} ${Math.round(8+Math.pow(Math.max(0,Math.min(1,v/max)),0.7)*82)}%, transparent)`;

    <p><strong>Blocks you</strong> is how often a team ends up in that at-large pile above ${T}. <strong>Finishes ahead</strong> counts every season it ranks above you, auto-bid or not. A team with a big gap between the two usually finishes ahead of you but wins its conference, so it rarely costs you a spot.</p>`;

      <td class="num" style="text-align:center">${t.wins.toFixed(1)}–${(t.games-t.wins).toFixed(1)}</td>
      <td class="pc"><span class="ramp num" style="${ramp(t.block,"var(--against)",maxB)}">${pct(t.block)}%</span></td>

}
