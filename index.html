<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leverage Board</title>
<meta name="theme-color" content="#0e2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leverage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
  :root{
    --field:#08182b; --panel:#0e2740; --panel2:#12314f; --line:#1c4166;
    --ink:#e9eef5; --muted:#8ba6c2; --gold:#c9a44c;
    --for:#3fa96b; --against:#c65442; --flat:#2b4a6d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--field);color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-text-size-adjust:100%}
  body{padding:0 0 64px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 14px}
  h1,h2,.serif{font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;font-weight:600}
  h1{font-size:24px;letter-spacing:-.01em;margin:0}
  h2{font-size:19px;margin:26px 0 6px;color:var(--ink)}
  h3{font-size:14.5px;margin:22px 0 6px;font-weight:600}
  .sub{color:var(--muted);font-size:13px}
  .num{font-variant-numeric:tabular-nums}
  /* section descriptions live behind an "i" button; tap to open */
  .explain{color:var(--muted);font-size:13.5px;max-width:760px;margin:0 0 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .explain:not(.open){display:none}
  .explain strong{color:var(--ink);font-weight:600}
  .explain p{margin:0 0 8px} .explain p:last-child{margin-bottom:0}
  h2{display:flex;align-items:center;gap:9px}
  .info{width:20px;height:20px;border-radius:50%;padding:0;background:transparent;color:var(--gold);border:1.5px solid var(--gold);
    font:italic 600 12px/1 Georgia,serif;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .info[aria-expanded=true]{background:var(--gold);color:#10233a}

  header{border-bottom:1px solid var(--line);padding:14px 0 12px;background:linear-gradient(180deg,#0b2038,var(--field))}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  select,button,input{font:inherit;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;padding:8px 10px}
  select{max-width:100%}
  button{cursor:pointer;background:var(--gold);color:#10233a;border-color:var(--gold);font-weight:650}
  button:disabled{opacity:.5;cursor:default}
  select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
  .prog{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:10px}
  .prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .12s}

  /* ---- tabs ---- */
  nav.tabs{position:sticky;top:0;z-index:5;background:var(--field);border-bottom:1px solid var(--line);
    display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:1 0 auto;background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;
    border-radius:0;padding:11px 14px;font-weight:600;font-size:14px;white-space:nowrap}
  nav.tabs button[aria-selected=true]{color:var(--gold);border-bottom-color:var(--gold)}
  section.tab{padding-top:6px}

  /* ---- overview ---- */
  .hero{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;padding:18px 0 4px}
  .odds{font-family:"Iowan Old Style",Georgia,serif;font-size:64px;line-height:.9;color:var(--gold)}
  .odds small{font-size:24px;opacity:.7}
  .heroLab{max-width:360px;color:var(--muted);font-size:13.5px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .stat b{display:block;font-size:22px;font-weight:600}
  .stat span{color:var(--muted);font-size:12px}

  /* ---- bracket ---- */
  .br{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin-top:4px}
  @media (max-width:640px){ .br{grid-template-columns:1fr} }
  .br h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .br .m{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin-bottom:8px}
  .br .m .vs{color:var(--muted);font-size:11.5px;text-align:center;padding:1px 0}
  .br .t{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
  .br .t .sd{color:var(--gold);font-weight:700;width:22px;text-align:right;font-variant-numeric:tabular-nums}
  .br .t .nm{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .br .t .nm.me{color:var(--gold)}
  .br .t .tag{font-size:11px;color:var(--muted);white-space:nowrap}
  .br .t .p{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;width:40px;text-align:right}
  .br .next{font-size:11.5px;color:var(--muted);margin:-2px 0 6px 32px}
  .bubble{margin-top:10px;font-size:13px;color:var(--muted)}
  .bubble b{color:var(--ink);font-weight:600}

  /* ---- game cards ---- */
  .g{padding:12px 0;border-bottom:1px solid var(--line)}
  .g.own{padding:12px 12px;margin:4px 0 8px;border-radius:9px;border:1px solid color-mix(in srgb, var(--gold) 55%, transparent)}
  .g.own .g-top, .g.own .g-odds span, .g.own .g-line{color:var(--ink)}
  .g.dev:not(.own){border-left:3px solid var(--gold);padding-left:10px}
  .g-dev{font-size:12.5px;color:var(--gold);margin-top:3px}
  .g-dev b{color:var(--gold)}
  .g-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:12.5px;color:var(--muted)}
  .g-top .lev{color:var(--ink);font-weight:600;white-space:nowrap}
  .g-top .lev b{color:var(--gold);font-size:15px}
  .g-match{font-size:16px;font-weight:600;margin-top:4px;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
  .g-match em{font-style:normal;color:var(--muted);font-weight:400}
  .rk{color:var(--gold);font-weight:600;font-size:12.5px}
  .g-line{font-size:12.5px;color:var(--muted)}
  .g-line b{color:var(--ink);font-weight:500}
  .chip{display:inline-block;padding:2px 8px;border-radius:6px;border:1.5px solid transparent;margin:0;line-height:1.3}
  .chip:not(.want):not(.mine){padding-left:0;padding-right:0}
  .chip small{color:var(--muted);font-weight:500;font-size:12px}
  .chip.want{border-color:var(--for)}
  .chip.mine{border-color:var(--gold)}
  .g-top .lev{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .pill{display:inline-block;border-radius:6px;padding:1px 8px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:38px;text-align:center}
  .pill.dim{color:var(--muted);font-weight:500}
  .g-top .lev small{font-weight:500;color:var(--muted);font-size:11.5px}
  .tn{cursor:pointer;text-decoration:underline dotted color-mix(in srgb, var(--muted) 60%, transparent);text-underline-offset:3px}
  .tn:hover{text-decoration-color:var(--gold)}
  /* team popup */
  .modal{position:fixed;inset:0;z-index:20;background:rgba(3,10,20,.7);display:flex;align-items:flex-end;justify-content:center}
  .modal[hidden]{display:none}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:14px 16px 24px}
  @media (min-width:640px){ .modal{align-items:center} .sheet{border-radius:14px;max-height:85vh} }
  .sheet h2{margin:0 0 2px;font-size:20px}
  .sheet h3{margin:16px 0 6px}
  .sheet .close{position:sticky;top:0;float:right;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;padding:0;font-size:18px;line-height:1}
  .sheet .kv{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 6px;font-size:13px;color:var(--muted)}
  .sheet .kv b{color:var(--ink);font-weight:600}
  .sheet table{font-size:13px}
  .sheet td.r2{text-align:right}
  .g-odds{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:13.5px}
  .g-odds span{color:var(--muted)}
  .g-odds b{font-weight:600}
  .g-odds .want b{color:var(--for)}
  .g-odds .want span{color:var(--ink)}
  .g-verdict{font-size:13px;margin-top:5px;color:var(--muted)}
  .g-verdict strong{color:var(--for)}
  .g-verdict.mine strong{color:var(--gold)}
  .g-verdict.flat{color:var(--muted)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{background:var(--panel2);color:var(--muted);border:0;border-radius:0;padding:6px 11px;font-size:13px;font-weight:500}
  .seg button[aria-pressed=true]{background:var(--gold);color:#10233a;font-weight:650}
  details.quiet{margin-top:12px;color:var(--muted);font-size:13px}
  details.quiet summary{cursor:pointer}

  /* ---- tables ---- */
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  @media (min-width:1100px){ #tab-board .scroll{margin:0 calc(50% - 50vw);padding:0 16px;width:100vw} }
  /* overview: bracket and blockers sit side by side when there's room */
  @media (min-width:1100px){
    .ov2{display:grid;grid-template-columns:1fr 1fr;gap:12px 32px;align-items:start;
      width:min(100vw,1500px);margin-left:calc(50% - min(50vw,750px));padding:0 16px}
    .ov2 .col{min-width:0}
  }
  th,td{padding:6px 7px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:11.5px;position:sticky;top:0;background:var(--field)}
  td.k{position:sticky;left:0;background:var(--field);font-weight:600;min-width:104px;z-index:1;box-shadow:2px 0 0 var(--line)}
  td.r{color:var(--muted);text-align:center;width:36px}
  td.r b{color:var(--gold);font-weight:600}
  th.c{text-align:center}
  .cell{border-radius:5px;padding:3px 6px;display:block;line-height:1.25;min-width:64px;color:var(--ink)}
  .cell small{display:block;color:var(--muted);font-size:11px}
  .cell.hot small{color:#e9eef5;opacity:.85}
  .cell small.tv{font-size:10px;opacity:.75;white-space:nowrap}
  .cell.w small{color:var(--for)} .cell.l small{color:var(--against)}
  .cell.h2h{border:1.5px solid var(--gold);color:var(--gold);background:transparent}
  .cell.h2h small{color:var(--gold);opacity:.8}
  tr.me td.k, td.me{color:var(--gold)}
  #rankings tr.me td{border-bottom:3px solid var(--gold);padding-bottom:9px}
  #rankings tr.sep td{height:10px;padding:0;border-bottom:0}
  .cell.own{border:1px solid color-mix(in srgb, var(--gold) 45%, transparent)}
  .ramp{display:block;border-radius:5px;padding:3px 7px;text-align:right;font-weight:600}
  .legend{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin:0 0 8px;font-size:12.5px;color:var(--muted)}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
  .foot{margin-top:30px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}
  @media (max-width:560px){ .odds{font-size:54px} h1{font-size:21px} .g-match{font-size:15px} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Leverage Board</h1>
  <div class="sub" id="stamp">Loading season data…</div>
  <div class="bar">
    <select id="team" aria-label="Team of interest"></select>
    <select id="sims" aria-label="Simulated seasons">
      <option value="5000">5,000 seasons</option>
      <option value="10000" selected>10,000 seasons</option>
      <option value="25000">25,000 seasons</option>
    </select>
    <label class="chk"><input type="checkbox" id="useLines"> Use betting lines instead of SP+</label>
    <button id="run">Run simulation</button>
  </div>
  <div class="prog"><i id="bar"></i></div>
  <div class="sub" id="cacheNote" hidden></div>
</div></header>

<nav class="tabs" id="tabs">
  <button data-tab="overview" aria-selected="true">Overview</button>
  <button data-tab="board" aria-selected="false">Top 25 board</button>
  <button data-tab="slate" aria-selected="false">This week</button>
  <button data-tab="season" aria-selected="false">Season</button>
</nav>

<div class="wrap">
  <section class="tab" id="tab-overview">
    <div class="hero">
      <div>
        <div class="odds num" id="odds">—<small>%</small></div>
        <div class="sub" id="oddsLab">chance of making the 12-team field</div>
      </div>
      <div class="heroLab" id="pathLab"></div>
    </div>
    <div class="stats">
      <div class="stat"><b class="num" id="sRec">—</b><span>projected record</span></div>
      <div class="stat"><b class="num" id="sRank">—</b><span>median final ranking</span></div>
      <div class="stat"><b class="num" id="sBlock">—</b><span>avg. blockers ahead (need ≤6)</span></div>
      <div class="stat"><b class="num" id="sChamp">—</b><span>chance of an auto-bid</span></div>
    </div>

    <div class="ov2">
      <div class="col">
        <h2>Projected bracket</h2>
        <div class="explain" id="bracketExplain"></div>
        <div id="bracket"></div>
      </div>
      <div class="col">
        <h2>Who is actually blocking you</h2>
        <div class="explain" id="blockExplain"></div>
        <div class="scroll"><table id="blockers"></table></div>
      </div>
    </div>
  </section>

  <section class="tab" id="tab-board" hidden>
    <h2>Top 25 schedule board</h2>
    <div class="explain" id="rankExplain"></div>
    <div class="scroll"><table id="rankings"></table></div>
  </section>

  <section class="tab" id="tab-slate" hidden>
    <h2><span id="slateTitle">This week</span></h2>
    <div class="explain" id="slateExplain"></div>
    <div class="controls">
      <select id="slateWeek" aria-label="Week"></select>
      <div class="seg" id="slateSort"><button data-v="lev" aria-pressed="true">Leverage score</button><button data-v="time" aria-pressed="false">Kickoff</button></div>
      <label class="chk"><input type="checkbox" id="slateRanked"> Ranked teams only</label>
    </div>
    <div id="slate"></div>
  </section>

  <section class="tab" id="tab-season" hidden>
    <h2>Season</h2>
    <div class="explain" id="seasonExplain"></div>
    <div class="controls">
      <div class="seg" id="seasonSort"><button data-v="lev" aria-pressed="true">Leverage score</button><button data-v="impact" aria-pressed="false">Impact</button></div>
    </div>
    <div id="season"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
const $ = s => document.querySelector(s);
let D=null, T=null, RES=null;
// per-device preferences (team, season count, lines toggle, last tab)
const pref = { get(k){ try{ return localStorage.getItem("lb."+k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem("lb."+k, v); }catch(e){} } };
const UI = { tab:"overview", slateWeek:null, slateSort:"lev", slateRanked:false, seasonSort:"lev" };

const norm = z => { // standard normal CDF
  const t = 1/(1+0.2316419*Math.abs(z));
  const d = 0.3989422804014327*Math.exp(-z*z/2);
  let p = d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>0 ? 1-p : p;
};
const pct = x => (x*100).toFixed(1);
const short = n => ({"Notre Dame":"Notre Dame","Ohio State":"Ohio St","Michigan State":"Mich St","Mississippi State":"Miss St","Washington State":"Wash St","Oklahoma State":"Okla St","Iowa State":"Iowa St","Arizona State":"Ariz St","Kansas State":"K State","Penn State":"Penn St","Florida State":"Fla St","Boise State":"Boise St","North Carolina":"UNC","South Carolina":"S Carolina","Texas A&M":"Texas A&M","Appalachian State":"App State","Fresno State":"Fresno St","Florida Atlantic":"FAU","Florida International":"FIU","Jacksonville State":"Jax State","Kennesaw State":"Kennesaw","Colorado State":"Colorado St","San Diego State":"SDSU","San José State":"SJSU","Oregon State":"Oregon St","Georgia Southern":"Ga Southern","Georgia State":"Ga State","Middle Tennessee":"MTSU","Northern Illinois":"NIU","New Mexico State":"NM State","Eastern Michigan":"E Michigan","Western Michigan":"W Michigan","Central Michigan":"C Michigan","Coastal Carolina":"Coastal","Southern Miss":"So Miss","Virginia Tech":"Va Tech","Arkansas State":"Ark State","Texas State":"Texas St","Utah State":"Utah St","Massachusetts":"UMass","North Dakota State":"NDSU","Sacramento State":"Sac State","Old Dominion":"ODU","South Florida":"USF","South Alabama":"S Alabama","West Virginia":"W Virginia","James Madison":"JMU","Bowling Green":"Bowling Grn","Kansas State":"Kansas St","Sam Houston":"Sam Houston","Western Kentucky":"W Kentucky","Georgia Tech":"Ga Tech","Boston College":"Boston Col","Louisiana Tech":"La Tech","Missouri State":"Missouri St","Northwestern":"N'western"}[n] || (n.length>11 ? n.slice(0,10)+"…" : n));

// Which poll drives the "#n" badges: the committee once it exists, otherwise AP.
const useCfp = () => !!(D.polls && D.polls.cfp);
const rankOf = team => { const t=D.teams[idx.get(team)]; if(!t) return null; return useCfp() ? (t.cfpRank||null) : (t.apRank||null); };
const isRanked = team => { const t=D.teams[idx.get(team)]; return !!(t && (t.apRank||t.cfpRank)); };
const isFcs = team => !!(D.teams[idx.get(team)]||{}).fcs;
const tn = (team, label) => `<span class="tn" data-team="${team.replace(/"/g,"&quot;")}">${label??team}</span>`;
const badge = team => { const r=rankOf(team); return r ? `<span class="rk">#${r}</span> ${tn(team)}` : (isFcs(team) ? `${tn(team)} <span class="rk" style="color:var(--muted)">FCS</span>` : tn(team)); };
const fmtKick = g => {
  if(!g.start) return "";
  const d=new Date(g.start); if(isNaN(d)) return "";
  const day=d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  if(g.tbd) return `${day} · TBD`;
  return `${day} · ${hhmm(d)}`;
};
// kickoff as a 24-hour clock in local time: 1330
const hhmm = d => String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");
// compact kickoff for board cells: "Sat 1530 · ABC"
const fmtKickShort = g => {
  if(!g.start) return "";
  const d=new Date(g.start); if(isNaN(d)) return "";
  const day=d.toLocaleDateString(undefined,{weekday:"short"});
  return `${day} ${g.tbd?"TBD":hhmm(d)}${g.tv?" · "+g.tv:""}`;
};
const fmtWin = p => p<0.005?"<1":p>0.995?">99":Math.round(p*100);

// ---------- load ----------
fetch("data.json?v="+Date.now(), {cache:"no-store"}).then(r=>r.json()).then(d=>{
  D = d; build();
  const pollBits=[];
  if(d.polls && d.polls.ap) pollBits.push(`AP wk ${d.polls.ap.week}`);
  if(d.polls && d.polls.cfp) pollBits.push(`CFP wk ${d.polls.cfp.week}`);
  $("#stamp").textContent = `${d.season} season · updated ${new Date(d.updatedAt).toLocaleDateString()}`
    + (pollBits.length?` · ${pollBits.join(" · ")}`:"") + (d.meta&&d.meta.ratings?` · ${d.meta.ratings}`:"") + (d.source==="placeholder" ? " · PLACEHOLDER DATA" : "");
  const sel = $("#team");
  d.teams.filter(t=>!t.fcs).sort((a,b)=>(rankOf(a.team)||99)-(rankOf(b.team)||99) || a.team.localeCompare(b.team))
    .forEach(t=>{ const o=document.createElement("option"); o.value=t.team; const r=rankOf(t.team); o.textContent=(r?`#${r} `:"")+t.team; sel.appendChild(o); });
  const saved = pref.get("team");
  sel.value = (saved && d.teams.some(t=>t.team===saved)) ? saved : d.teams.some(t=>t.team==="Notre Dame") ? "Notre Dame" : d.teams[0].team;
  const sims = pref.get("sims"); if(sims && [...$("#sims").options].some(o=>o.value===sims)) $("#sims").value = sims;
  const lines = pref.get("lines"); if(lines!==null) $("#useLines").checked = lines==="1";
  const tab = pref.get("tab"); if(tab && document.querySelector(`#tabs button[data-tab="${tab}"]`)) showTab(tab);
  run();
}).catch(e=>{ $("#stamp").textContent="Couldn't load data.json — run scripts/fetch-data.mjs first."; });

// ---------- precompute ----------
let idx, rating, confOf, tierOf, confList, P4=["ACC","Big Ten","Big 12","SEC"];
let gH,gA,gP,gPsp,gPline,gConf,gDone,gRes,gWeek,gLine,gHfa,nG,nT;
let confIdx, members, isP4, teamGames, gamesPerTeam;
function build(){
  nT = D.teams.length;
  idx = new Map(D.teams.map((t,i)=>[t.team,i]));
  rating = Float64Array.from(D.teams.map(t=>t.rating));
  confOf = D.teams.map(t=>t.conference);
  tierOf = D.conferenceTiers;
  confList = [...new Set(confOf)].filter(c=>tierOf[c]!=="IND" && tierOf[c]!=="FCS");
  confIdx = new Int32Array(nT).fill(-1);
  members = confList.map(()=>[]);
  confList.forEach((c,k)=>{ for(let i=0;i<nT;i++) if(confOf[i]===c){ confIdx[i]=k; members[k].push(i); } });
  isP4 = confList.map(c=>P4.includes(c));
  const g = D.games; nG = g.length;
  gH=new Int32Array(nG); gA=new Int32Array(nG); gP=new Float64Array(nG); gPsp=new Float64Array(nG); gPline=new Float64Array(nG).fill(NaN); gLine=new Uint8Array(nG); gHfa=new Float64Array(nG);
  gConf=new Uint8Array(nG); gDone=new Uint8Array(nG); gRes=new Uint8Array(nG); gWeek=new Int32Array(nG);
  const {hfa,sdMargin}=D.config, spreadSd=D.config.spreadSd||13.5;
  const useLines = $("#useLines").checked;
  const tg = D.teams.map(()=>[]);
  g.forEach((x,i)=>{
    gH[i]=idx.get(x.home); gA[i]=idx.get(x.away); gWeek[i]=x.week;
    gConf[i]=x.conferenceGame?1:0; gDone[i]=x.completed?1:0; gRes[i]=x.homeWin?1:0; gHfa[i]=x.neutral?0:hfa;
    tg[gH[i]].push(i); tg[gA[i]].push(i);
    gPsp[i]=norm(((rating[gH[i]]-rating[gA[i]])+gHfa[i])/sdMargin);
    if(typeof x.spread==="number" && isFinite(x.spread)) gPline[i]=norm(-x.spread/spreadSd); // spread is home-perspective, negative = home favoured
    if(useLines && !isNaN(gPline[i])){ gP[i]=gPline[i]; gLine[i]=1; } else gP[i]=gPsp[i];
  });
  teamGames = tg.map(a=>Int32Array.from(a));
  gamesPerTeam = Int32Array.from(tg.map(a=>a.length));
}

// ---------- simulation ----------
// Each simulated season is played out once, then every remaining game is flipped in place and the
// target's fate is re-evaluated with everything else held fixed. That paired comparison is what makes
// a game's leverage precise: a 25-point favourite's game contributes exactly zero unless flipping it
// actually changes the target's outcome.
//
// Committee stand-in: true strength (rating + per-season noise) plus a résumé built from opponents'
// FINAL records. Beating a team is worth more the more games that team ends up winning; losing costs a
// flat penalty plus more the worse the opponent turns out. So your opponents' other games matter to you.
function simulate(target, N, onProgress, done){
  const ti = idx.get(target);
  const W=new Int32Array(nT), L=new Int32Array(nT), CW=new Int32Array(nT), CL=new Int32Array(nT);
  const resume=new Float64Array(nT), score=new Float64Array(nT), aq=new Uint8Array(nT);
  const res=new Uint8Array(nG);
  const nC=confList.length, champ=new Int32Array(nC), uC=new Float64Array(nC);
  let bestG6=-1, blockers=0;
  const {ratingWeight,resumeWeight,atLargeSlots,sdMargin}=D.config;
  const LP = D.config.lossPenalty ?? 5, LQ = D.config.lossQuality ?? 0.35;
  // Quality wins: only beating teams that finish with strong records earns credit, and it ramps up fast.
  // Beating a 7-5 team is worth almost nothing; beating a 10-2 team is a real résumé line.
  const WC = D.config.winCurve ?? 0.1, WF = D.config.winFloor ?? 7;
  const winGain = wins => { const x=wins-WF; return x>0 ? WC*x*x : 0; };
  const RS = D.config.ratingSd ?? 8;
  const rs = new Float64Array(nT);

  const acc={ in:0, champ:0, rankSum:0, blockSum:0, winSum:0, ranks:new Int32Array(nT+2),
    blockers:new Float64Array(nT), aheadN:new Float64Array(nT), teamWins:new Float64Array(nT),
    fieldN:new Float64Array(nT), seedSum:new Float64Array(nT), p4ChampN:new Float64Array(nT), g6N:new Float64Array(nT),
    sumH:new Float64Array(nG), sumA:new Float64Array(nG), sumD:new Float64Array(nG), sumD2:new Float64Array(nG) };

  const order=new Int32Array(nT); for(let i=0;i<nT;i++) order[i]=i;
  let x=2463534242>>>0; // xorshift32
  const rnd=()=>{ x^=x<<13; x>>>=0; x^=x>>17; x^=x<<5; x>>>=0; return x/4294967296; };

  function resolveConf(k){
    let a=-1,b=-1,as=-1e9,bs=-1e9;
    const m=members[k];
    for(let j=0;j<m.length;j++){
      const i=m[j], gp=CW[i]+CL[i], v=(gp?CW[i]/gp:0)*100 + rs[i]/50;
      if(v>as){b=a;bs=as;a=i;as=v;} else if(v>bs){b=i;bs=v;}
    }
    if(a<0) return -1;
    if(b<0) return a;
    const p=norm((rs[a]-rs[b])/sdMargin);
    return uC[k]<p?a:b;
  }

  // sparse score overrides for the flip evaluation
  const stamp=new Int32Array(nT); let cur=0;
  const dS=new Float64Array(nT), touched=new Int32Array(nT); let nTouch=0;
  const touch=(j,delta)=>{ if(stamp[j]!==cur){ stamp[j]=cur; dS[j]=0; touched[nTouch++]=j; } dS[j]+=delta; };
  const sc=j=> stamp[j]===cur ? score[j]+dS[j] : score[j];

  function flipInField(i){
    cur++; nTouch=0;
    const h=gH[i], a=gA[i], hw=res[i];
    const w=hw?h:a, l=hw?a:h;                       // actual winner / loser; after the flip, l wins
    const rw=resumeWeight;
    // the two teams in the game swap their result
    touch(w, rw*( -winGain(W[l]) - (LP + LQ*(L[l]-1)) ));
    touch(l, rw*( (LP + LQ*L[w]) + winGain(W[w]-1) ));
    const dl = winGain(W[l]+1)-winGain(W[l]), dw = winGain(W[w]-1)-winGain(W[w]);
    // everyone who played l: l finishes with one more win, so beating l is worth more and losing to l costs less
    const tl=teamGames[l];
    for(let q=0;q<tl.length;q++){ const j=tl[q]; if(j===i) continue;
      const o = gH[j]===l?gA[j]:gH[j]; const oWon = (gH[j]===o)===(res[j]===1); touch(o, rw*(oWon?dl:LQ)); }
    // everyone who played w: the reverse
    const tw=teamGames[w];
    for(let q=0;q<tw.length;q++){ const j=tw[q]; if(j===i) continue;
      const o = gH[j]===w?gA[j]:gH[j]; const oWon = (gH[j]===o)===(res[j]===1); touch(o, rw*(oWon?dw:-LQ)); }

    // conference champion of the game's conference may change
    let k=-1, oldC=-1, newC=-1;
    if(gConf[i]){
      k=confIdx[h];
      if(k>=0){
        CW[w]--;CL[w]++;CW[l]++;CL[l]--;
        newC=resolveConf(k);
        CW[w]++;CL[w]--;CW[l]--;CL[l]++;
        oldC=champ[k];
        if(newC===oldC){ k=-1; oldC=newC=-1; }
      }
    }
    // Group-of-Six auto-bid: re-pick if a G6 champion changed or any touched team is a G6 champion
    let newG6=bestG6, g6Touch = k>=0 && !isP4[k];
    if(!g6Touch) for(let q=0;q<nTouch;q++){ const j=touched[q], kk=confIdx[j]; if(kk>=0 && !isP4[kk] && champ[kk]===j){ g6Touch=true; break; } }
    if(g6Touch){
      newG6=-1; let best=-1e9;
      for(let kk=0;kk<nC;kk++){
        if(isP4[kk]) continue;
        const c = kk===k ? newC : champ[kk];
        if(c>=0 && sc(c)>best){ best=sc(c); newG6=c; }
      }
    }
    const p4Change = k>=0 && isP4[k];
    const aqOf = j => {
      if(p4Change){ if(j===newC) return 1; if(j===oldC) return 0; }
      if(j===newG6) return 1;
      if(j===bestG6) return 0;
      return aq[j];
    };

    let B;
    if(stamp[ti]===cur){
      // the target's own score moved: recount everyone
      const ts=sc(ti); B=0;
      for(let j=0;j<nT;j++){ if(j===ti) continue; if(sc(j)>ts && !aqOf(j)) B++; }
    } else {
      const ts=score[ti]; B=blockers;
      if(oldC>=0 && oldC!==ti) touch(oldC,0); if(newC>=0 && newC!==ti) touch(newC,0);
      if(bestG6>=0 && bestG6!==ti) touch(bestG6,0); if(newG6>=0 && newG6!==ti) touch(newG6,0);
      for(let q=0;q<nTouch;q++){
        const j=touched[q]; if(j===ti) continue;
        const was = (score[j]>ts && !aq[j]) ? 1:0;
        const now = (sc(j)>ts && !aqOf(j)) ? 1:0;
        B += now-was;
      }
    }
    return (aqOf(ti) || B<atLargeSlots) ? 1 : 0;
  }

  let n=0;
  function chunk(){
    const end=Math.min(N,n+250);
    for(;n<end;n++){
      W.fill(0);L.fill(0);CW.fill(0);CL.fill(0);resume.fill(0);aq.fill(0);
      for(let i=0;i<nT;i++){ const u=Math.max(1e-12,rnd()), v=rnd(); rs[i]=rating[i]+RS*Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307179586*v); }
      for(let i=0;i<nG;i++){
        const h=gH[i],a=gA[i];
        const p = gLine[i] ? gP[i] : norm(((rs[h]-rs[a])+gHfa[i])/sdMargin);
        const hw = gDone[i] ? gRes[i] : (rnd()<p?1:0);
        res[i]=hw;
        const w=hw?h:a, l=hw?a:h;
        W[w]++; L[l]++;
        if(gConf[i]){CW[w]++;CL[l]++;}
      }
      // résumé from final records
      for(let i=0;i<nG;i++){
        const hw=res[i], w=hw?gH[i]:gA[i], l=hw?gA[i]:gH[i];
        resume[w] += winGain(W[l]);
        resume[l] -= LP + LQ*L[w];
      }
      for(let i=0;i<nT;i++){ score[i]=rs[i]*ratingWeight + resume[i]*resumeWeight; acc.teamWins[i]+=W[i]; }

      // conference champions
      bestG6=-1; let bestG6s=-1e9;
      for(let k=0;k<nC;k++){
        uC[k]=rnd();
        const c=resolveConf(k); champ[k]=c;
        if(c<0) continue;
        if(isP4[k]) aq[c]=1;
        else if(score[c]>bestG6s){bestG6=c;bestG6s=score[c];}
      }
      if(bestG6>=0){ aq[bestG6]=1; acc.g6N[bestG6]++; }
      for(let k=0;k<nC;k++) if(isP4[k] && champ[k]>=0) acc.p4ChampN[champ[k]]++;

      // the full 12-team field this season: every auto-bid plus the seven best non-champions, seeded by ranking
      order.sort((p,q)=>score[q]-score[p]);
      { let seed=0, al=0;
        for(let j=0;j<nT && seed<12;j++){ const i=order[j];
          if(aq[i] || al<atLargeSlots){ if(!aq[i]) al++; seed++; acc.fieldN[i]++; acc.seedSum[i]+=seed; } } }

      // where does the target land
      const ts=score[ti];
      let ahead=0; blockers=0;
      for(let i=0;i<nT;i++){
        if(i===ti) continue;
        if(score[i]>ts){ ahead++; acc.aheadN[i]++; if(!aq[i]){ blockers++; acc.blockers[i]++; } }
      }
      const inField = (aq[ti]===1 || blockers < atLargeSlots) ? 1 : 0;
      acc.in+=inField; acc.champ+=aq[ti];
      acc.rankSum+=ahead+1; acc.blockSum+=blockers; acc.winSum+=W[ti];
      acc.ranks[Math.min(nT+1,ahead+1)]++;

      // paired leverage
      for(let i=0;i<nG;i++){
        if(gDone[i]) continue;
        const flipped=flipInField(i);
        const FH = res[i] ? inField : flipped;
        const FA = res[i] ? flipped : inField;
        acc.sumH[i]+=FH; acc.sumA[i]+=FA;
        const d=FH-FA; acc.sumD[i]+=d; acc.sumD2[i]+=d*d;
      }
    }
    onProgress(n/N);
    if(n<N) setTimeout(chunk,0); else done(finish(acc,N,ti));
  }
  chunk();
}

function finish(acc,N,ti){
  const games=[];
  for(let i=0;i<nG;i++){
    if(gDone[i]) continue;
    const src=D.games[i];
    const pH=acc.sumH[i]/N, pA=acc.sumA[i]/N, swing=acc.sumD[i]/N;
    const varD=Math.max(0, acc.sumD2[i]/N - swing*swing);
    const se=Math.sqrt(varD/N);
    const p=gP[i];
    games.push({i,week:gWeek[i],home:src.home,away:src.away,start:src.start||null,tbd:!!src.tbd,tv:src.tv||null,
      spread:src.spread??null,spreadText:src.spreadText||"",overUnder:src.overUnder??null,
      pHomeWin:p, pSp:gPsp[i], pLine:isNaN(gPline[i])?null:gPline[i], line:!!gLine[i], involvesMe: gH[i]===ti||gA[i]===ti,
      pH,pA,swing,se, clear: Math.abs(swing)>=0.001 && Math.abs(swing)>=2.5*se,
      // Leverage score: impact weighted by how uncertain the game is. A coin flip keeps its full impact;
      // a 97/3 game keeps about 12% of it, because the outcome you want almost never happens.
      lev: Math.abs(swing)*100 * 4*p*(1-p)});
  }
  // Normalise to 0-100 on two separate scales: other teams' games against the biggest of those,
  // and the target's own games against the biggest game on its own schedule.
  const ext=games.filter(g=>g.clear&&!g.involvesMe), own=games.filter(g=>g.clear&&g.involvesMe);
  const levMax=Math.max(1e-6,...ext.map(g=>g.lev)), impMax=Math.max(1e-6,...ext.map(g=>Math.abs(g.swing)));
  const ownLevMax=Math.max(1e-6,...own.map(g=>g.lev)), ownImpMax=Math.max(1e-6,...own.map(g=>Math.abs(g.swing)));
  games.forEach(g=>{
    const lm=g.involvesMe?ownLevMax:levMax, im=g.involvesMe?ownImpMax:impMax;
    g.levN=Math.min(100,g.lev/lm*100); g.impN=Math.min(100,Math.abs(g.swing)/im*100);
  });
  let med=1,cum=0; for(let r=1;r<acc.ranks.length;r++){cum+=acc.ranks[r]; if(cum>=N/2){med=r;break;}}
  const teamStats=D.teams.map((t,i)=>({team:t.team,conf:t.conference,fcs:!!t.fcs,
    block:acc.blockers[i]/N, ahead:acc.aheadN[i]/N, wins:acc.teamWins[i]/N, games:gamesPerTeam[i],
    pIn:acc.fieldN[i]/N, avgSeed:acc.fieldN[i]?acc.seedSum[i]/acc.fieldN[i]:99, pP4Champ:acc.p4ChampN[i]/N, pG6:acc.g6N[i]/N}));
  return { pIn:acc.in/N, pChamp:acc.champ/N, medRank:med, avgBlock:acc.blockSum/N,
           avgWins:acc.winSum/N, myGames:gamesPerTeam[ti], games, teamStats, N };
}

// ---------- render ----------
// The last result is kept on the device and reused until the data file changes or the settings do.
// The Run button always recomputes.
const RESULT_VERSION = 3; // bump when the result shape changes so stale saved results are recomputed
const resultKey = () => `v${RESULT_VERSION}|${D.updatedAt}|${T}|${$("#sims").value}|${$("#useLines").checked?1:0}`;
function loadResult(){ try{ const c=JSON.parse(localStorage.getItem("lb.result")||"null"); return c && c.key===resultKey() ? c : null; }catch(e){ return null; } }
function saveResult(r){ try{ localStorage.setItem("lb.result", JSON.stringify({key:resultKey(), at:Date.now(), res:r})); }catch(e){} }
$("#run").onclick=()=>run(true); $("#team").onchange=()=>run(false); $("#useLines").onchange=()=>run(false); $("#sims").onchange=()=>run(false);
function run(force){
  T=$("#team").value; const N=+$("#sims").value;
  pref.set("team",T); pref.set("sims",String(N)); pref.set("lines",$("#useLines").checked?"1":"0");
  build();
  if(!force){
    const c=loadResult();
    if(c){ RES=c.res; RES.cachedAt=c.at; render(); return; }
  }
  $("#run").disabled=true; $("#run").textContent="Simulating…"; $("#cacheNote").hidden=true;
  simulate(T,N,p=>{$("#bar").style.width=(p*100)+"%";},r=>{
    RES=r; $("#run").disabled=false; $("#run").textContent="Run simulation"; $("#bar").style.width="0";
    saveResult(r); render();
  });
}

// team popup: full schedule with results, plus SP+ by unit
document.addEventListener("click",e=>{
  const t=e.target.closest(".tn"); if(t){ openTeam(t.dataset.team); return; }
  if(e.target.closest(".close") || e.target.id==="modal") closeTeam();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeTeam(); });
function closeTeam(){ $("#modal").hidden=true; document.body.style.overflow=""; }
function openTeam(name){
  const tm=D.teams[idx.get(name)]; if(!tm) return;
  const st=RES ? RES.teamStats.find(x=>x.team===name) : null;
  const sp=tm.sp;
  const unitRow=(lab,u)=> u && u.rating!=null ? `<tr><td>${lab}</td><td class="r2 num">${(+u.rating).toFixed(1)}</td><td class="r2 num sub">${u.rank?"#"+u.rank:""}</td></tr>` : "";
  const spHtml = sp ? `<h3>SP+ by unit${sp.prior?' <span class="sub">(last season, until this year\'s are published)</span>':""}</h3>
      <table><tr><th></th><th class="c">Rating</th><th class="c">Rank</th></tr>
      ${unitRow("Overall",{rating:sp.rating,rank:sp.rank})}${unitRow("Offense",sp.offense)}${unitRow("Defense",sp.defense)}${unitRow("Special teams",sp.specialTeams)}</table>`
    : `<h3>SP+</h3><div class="sub">Overall rating ${tm.rating}. The unit breakdown arrives with the next data refresh.</div>`;
  const games=D.games.map((g,i)=>({g,i})).filter(x=>x.g.home===name||x.g.away===name).sort((a,b)=>a.g.week-b.g.week);
  const levOf=new Map(); if(RES) RES.games.forEach(x=>levOf.set(x.i,x));
  const rows=games.map(({g,i})=>{
    const L=levOf.get(i);
    const lev = !L ? "" : scorePill(L.lev>0?L.levN:null, L.clear);
    const isHome=g.home===name, opp=isHome?g.away:g.home;
    const p = isHome ? gP[i] : 1-gP[i];
    let res;
    if(g.completed){ const won=isHome?g.homeWin:!g.homeWin; const mine=isHome?g.homeScore:g.awayScore, theirs=isHome?g.awayScore:g.homeScore;
      res=`<span class="${won?"good":"bad"}">${won?"W":"L"}${mine!=null?` ${mine}-${theirs}`:""}</span>`; }
    else res=`<span class="num">${Math.round(p*100)}%</span>`;
    const when=g.completed?"":fmtKickShort(g);
    return `<tr><td class="sub num">${g.week}</td><td>${isHome?"":"@"}${badge(opp)}${g.neutral?' <span class="sub">(N)</span>':""}</td><td class="r2">${res}</td><td class="r2">${lev}</td><td class="sub">${when}${g.spreadText&&!g.completed?` · ${g.spreadText}`:""}</td></tr>`;
  }).join("");
  const rk=[tm.apRank?`AP #${tm.apRank}`:null, tm.cfpRank?`CFP #${tm.cfpRank}`:null].filter(Boolean).join(" · ");
  $("#sheet").innerHTML=`<button class="close" aria-label="Close">×</button>
    <h2>${name}</h2>
    <div class="kv"><span>${tm.conference}</span>${rk?`<span>${rk}</span>`:""}${st?`<span>Proj. <b class="num">${st.wins.toFixed(1)}–${(st.games-st.wins).toFixed(1)}</b></span><span>Playoff <b class="num">${Math.round(st.pIn*100)}%</b></span>`:""}</div>
    ${spHtml}
    <h3>Schedule <span class="sub" style="font-weight:400">· leverage is for ${T}</span></h3>
    <div class="scroll"><table><tr><th>Wk</th><th>Opponent</th><th class="c">Win chance</th><th class="c">Leverage</th><th>Kickoff</th></tr>${rows}</table></div>`;
  $("#modal").hidden=false; document.body.style.overflow="hidden"; $("#sheet").scrollTop=0;
}

function render(){
  const r=RES;
  const note=$("#cacheNote");
  if(r.cachedAt){ note.hidden=false; note.textContent=`Showing the result saved on this device ${new Date(r.cachedAt).toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"})}. It stays until the data refreshes; press Run simulation to recompute now.`; }
  else note.hidden=true;
  $("#odds").innerHTML = pct(r.pIn)+"<small>%</small>";
  $("#oddsLab").textContent = `chance ${T} makes the 12-team field`;
  $("#pathLab").innerHTML = D.conferenceTiers[D.teams[idx.get(T)].conference]==="IND"
    ? `${T} is an independent, so there is no auto-bid path. The only route is finishing among the seven highest-ranked teams that <em>aren't</em> conference champions.`
    : `Two routes: win the conference for an auto-bid, or land among the seven highest-ranked non-champions.`;
  $("#sRec").textContent=`${r.avgWins.toFixed(1)}–${(r.myGames-r.avgWins).toFixed(1)}`;
  $("#sRank").textContent="#"+r.medRank;
  $("#sBlock").textContent=r.avgBlock.toFixed(1);
  $("#sChamp").textContent=pct(r.pChamp)+"%";

  renderBracket(r);
  renderBlockers(r);
  renderBoard(r);
  renderSlate(r);
  renderSeason(r);

  const lined=r.games.filter(g=>g.line).length;
  $("#foot").innerHTML = `${r.N.toLocaleString()} simulated seasons. Field = ACC, Big Ten, Big 12 and SEC champions plus the highest-ranked Group of Six champion, then the seven highest-ranked teams remaining. `
    + (lined?`Win probabilities for the ${lined} upcoming games with a posted line come from the point spread; the rest use the SP+ rating gap with home advantage. `
            :`Win probabilities come from the SP+ rating gap with home advantage${$("#useLines").checked?" (no betting lines in this data yet)":"; tick the box at the top to use betting lines instead"}. `)
    + `Final ordering is a strength-plus-résumé stand-in for the committee, not the committee itself.`;
}

function renderBracket(r){
  const st=r.teamStats.filter(t=>!t.fcs);
  const byConf=new Map(); st.forEach(t=>{ if(!byConf.has(t.conf)) byConf.set(t.conf,[]); byConf.get(t.conf).push(t); });
  const field=[], taken=new Set();
  const take=(t,tag)=>{ if(!t||taken.has(t.team)) return; taken.add(t.team); field.push({...t,tag}); };
  // four P4 champions: the most likely winner of each conference
  for(const c of P4){ const list=byConf.get(c)||[]; take(list.slice().sort((a,b)=>b.pP4Champ-a.pP4Champ)[0], c+" champ"); }
  // best Group of Six champion
  take(st.slice().sort((a,b)=>b.pG6-a.pG6)[0], "G6 champ");
  // seven at-larges by playoff probability
  st.filter(t=>!taken.has(t.team)).sort((a,b)=>b.pIn-a.pIn).slice(0,D.config.atLargeSlots).forEach(t=>take(t,"at-large"));
  field.sort((a,b)=>a.avgSeed-b.avgSeed);
  field.forEach((t,i)=>t.seed=i+1);
  const me=field.find(t=>t.team===T), mine=st.find(t=>t.team===T);
  const nextOut=st.filter(t=>!taken.has(t.team)).sort((a,b)=>b.pIn-a.pIn).slice(0,4);

  $("#bracketExplain").innerHTML = `<p>The most likely field: each Power Four conference's most probable champion takes its auto-bid, the strongest Group of Six champion takes the fifth, and seven at-larges fill in by playoff probability. Seeds are each team's average seed across the seasons it made the field. Straight seeding: the four highest-ranked teams get byes whether or not they won a conference. The % is each team's overall chance of making the field.</p>`;

  const row=t=>`<div class="t"><span class="sd num">${t.seed}</span><span class="nm ${t.team===T?"me":""}">${tn(t.team)}</span><span class="tag">${t.tag}</span><span class="p">${Math.round(t.pIn*100)}%</span></div>`;
  const S=n=>field[n-1];
  const game=(hi,lo,next)=>`<div class="m">${row(S(lo))}<div class="vs">at</div>${row(S(hi))}</div><div class="next">winner meets #${next} ${short(S(next).team)}</div>`;
  $("#bracket").innerHTML = `<div class="br">
    <div><h3>First round</h3>${game(5,12,4)}${game(8,9,1)}${game(6,11,3)}${game(7,10,2)}</div>
    <div><h3>Byes to the quarterfinals</h3><div class="m">${[1,2,3,4].map(n=>row(S(n))).join("")}</div>
      <h3 style="margin-top:14px">First teams out</h3><div class="m">${nextOut.map(t=>`<div class="t"><span class="sd"></span><span class="nm ${t.team===T?"me":""}">${tn(t.team)}</span><span class="tag">${t.conf}</span><span class="p">${Math.round(t.pIn*100)}%</span></div>`).join("")}</div>
    </div></div>
    <div class="bubble">${me
      ? `<b>${T}</b> projects as the #${me.seed} seed${me.seed<=4?" with a bye":me.seed<=8?", hosting a first-round game":", on the road in the first round"}. Average seed when in: ${mine.avgSeed.toFixed(1)}.`
      : `<b>${T}</b> is not in the projected field (${Math.round(mine.pIn*100)}% to make it${mine.pIn>0?`, average seed ${mine.avgSeed.toFixed(1)} when in`:""}).`}</div>`;
}

// 0-100 score -> gold pill whose intensity follows the score
const scorePill = (v, ok=true) => ok
  ? `<span class="pill" style="background:color-mix(in srgb, var(--gold) ${Math.round(8+Math.pow(Math.max(0,Math.min(100,v))/100,0.7)*82)}%, transparent)">${Math.round(v)}</span>`
  : `<span class="pill dim">${v==null?"—":"~"+Math.round(v)}</span>`;
// percentage ramp with the same intensity curve as the score pills
const ramp = (v,color,max=1) => `background:color-mix(in srgb, ${color} ${Math.round(8+Math.pow(Math.max(0,Math.min(1,v/max)),0.7)*82)}%, transparent)`;

function renderBlockers(r){
  $("#blockExplain").innerHTML = `<p>There are seven at-large spots. Only teams that finish ranked ahead of ${T} <strong>without</strong> winning their conference compete for them, because conference champions take auto-bids instead. Those teams are your blockers. Six or fewer blockers and you're in.</p>
    <p><strong>Blocks you</strong> is how often a team ends up in that at-large pile above ${T}. <strong>Finishes ahead</strong> counts every season it ranks above you, auto-bid or not. A team with a big gap between the two usually finishes ahead of you but wins its conference, so it rarely costs you a spot.</p>`;
  const blk=r.teamStats.filter(t=>t.team!==T&&!t.fcs).sort((a,b)=>b.block-a.block).slice(0,25);
  const maxB=Math.max(0.01,...blk.map(t=>t.block));
  $("#blockers").innerHTML = `<tr><th>Rank</th><th>Team</th><th>Conf</th><th class="c">Proj. record</th><th class="c">Blocks you</th><th class="c">Finishes ahead</th></tr>`+
    blk.map(t=>{const rk=rankOf(t.team);return `<tr><td class="r num">${rk?"#"+rk:"NR"}</td><td class="k">${tn(t.team)}</td><td class="sub">${t.conf}</td>
      <td class="num" style="text-align:center">${t.wins.toFixed(1)}–${(t.games-t.wins).toFixed(1)}</td>
      <td><span class="ramp num" style="${ramp(t.block,"var(--against)",maxB)}">${pct(t.block)}%</span></td>
      <td><span class="ramp num" style="${ramp(t.ahead,"var(--flat)")}">${pct(t.ahead)}%</span></td></tr>`;}).join("");
}

function renderBoard(r){
  const ap=D.polls&&D.polls.ap, cfp=D.polls&&D.polls.cfp;
  const src = D.meta&&D.meta.ratings ? D.meta.ratings : "SP+";
  $("#rankExplain").innerHTML = `<p>${cfp
    ? `Ordered by the <strong>CFP committee ranking</strong> (week ${cfp.week}), which is what actually seeds the bracket, with the AP poll alongside.`
    : `Ordered by the <strong>AP poll</strong> (week ${ap?ap.week:"—"}) until the CFP committee releases its first ranking in early November, then by the committee.`}
    Unranked teams that often finish ahead of ${T} are included too.</p>
    <div class="legend"><span><i style="background:var(--for)"></i>You want them to win</span><span><i style="background:var(--against)"></i>You want them to lose</span><span><i style="background:var(--panel2)"></i>Doesn't affect you</span><span><i style="border:1.5px solid var(--gold);background:transparent"></i>Head-to-head with you</span><span>Your own row is shaded by your chance of winning</span><span>Darker = higher leverage score · "@" = on the road · % = their chance of winning · kickoff is a 24-hour clock in your local time</span></div>
    <p>Each cell is that week's opponent and the row team's chance of winning, from the <strong>${src}</strong> rating gap plus home advantage. Tick "Use betting lines" at the top to have posted point spreads replace SP+ where they exist. Shading shows whether ${T} wants the row team to win or lose that game, and how much: it follows the <strong>leverage score</strong>, so a lopsided game fades even when the upset would matter.</p>`;

  const weeks=[...new Set(D.games.map(g=>g.week))].sort((a,b)=>a-b);
  const stat=new Map(r.teamStats.map(t=>[t.team,t]));
  const contenders=new Set(D.teams.filter(t=>t.apRank||t.cfpRank).map(t=>t.team));
  r.teamStats.filter(t=>t.team!==T&&!t.fcs).sort((a,b)=>b.ahead-a.ahead).slice(0,20).forEach(t=>contenders.add(t.team));
  contenders.add(T);
  const rows=[T, ...[...contenders].filter(n=>n!==T).map(n=>D.teams[idx.get(n)])
    .sort((a,b)=>(useCfp()?(a.cfpRank||99)-(b.cfpRank||99):0) || (a.apRank||99)-(b.apRank||99) || (stat.get(b.team).ahead)-(stat.get(a.team).ahead))
    .map(t=>t.team)];

  // shading = the same 0-100 leverage score as the pills, signed by who the target wants
  const lev=new Map(); r.games.forEach(g=>lev.set(g.i, g.clear ? Math.sign(g.swing)*g.levN : 0));
  const scale=100;
  const byTeam=new Map();
  D.games.forEach((g,i)=>{
    const sw=lev.get(i)||0;
    for(const [t,opp,isHome] of [[g.home,g.away,1],[g.away,g.home,0]]){
      if(!byTeam.has(t)) byTeam.set(t,new Map());
      const pWin = isHome ? gP[i] : 1-gP[i];
      let result=null;
      if(g.completed){ const won = isHome ? g.homeWin : !g.homeWin;
        const mine = isHome ? g.homeScore : g.awayScore, theirs = isHome ? g.awayScore : g.homeScore;
        result={won, text:(won?"W":"L")+(mine!=null&&theirs!=null?` ${mine}-${theirs}`:"")}; }
      byTeam.get(t).set(g.week,{opp,isHome,pWin,result,sw:isHome?sw:-sw,mine:t===T||opp===T,kick:g.completed?"":fmtKickShort(g)});
    }
  });

  $("#rankings").innerHTML = `<tr><th>Team</th><th class="c">AP</th><th class="c">CFP</th><th class="c">Playoff</th>${weeks.map(w=>`<th>Wk ${w}</th>`).join("")}</tr>`+
    rows.map(t=>{
      const tm=D.teams[idx.get(t)], m=byTeam.get(t)||new Map(), st=stat.get(t);
      const rk=(v,hot)=>v?(hot?`<b>${v}</b>`:v):"NR";
      return (t!==T && rows[0]===T && rows[1]===t ? `<tr class="sep"><td colspan="${weeks.length+4}"></td></tr>` : "") + `<tr class="${t===T?"me":""}"><td class="k">${tn(t,short(t))}</td><td class="r num">${rk(tm.apRank,!useCfp())}</td><td class="r num">${rk(tm.cfpRank,useCfp())}</td><td class="r"><span class="ramp num" style="${ramp(st?st.pIn:0,"var(--for)")};padding:2px 6px">${st?Math.round(st.pIn*100):0}%</span></td>`+weeks.map(w=>{
        const c=m.get(w); if(!c) return `<td><span class="cell"><small>bye</small></span></td>`;
        const sub = c.result ? c.result.text : `${Math.round(c.pWin*100)}%`;
        const res = c.result ? (c.result.won?" w":" l") : "";
        // the selected team's own row: shade by its chance of winning each game
        if(t===T){
          const p=c.pWin, up=p>=0.5, k=Math.min(1,Math.abs(p-0.5)/0.5);
          const mix=Math.round(15+k*75);
          const bg=c.result ? "transparent" : `color-mix(in srgb, ${up?"var(--for)":"var(--against)"} ${mix}%, transparent)`;
          return `<td><span class="cell own${res}${mix>=55?" hot":""}" style="background:${bg}">${c.isHome?"":"@"}${short(c.opp)}<small class="num">${sub}</small>${c.kick?`<small class="tv">${c.kick}</small>`:""}</span></td>`;
        }
        // head-to-head with the selected team in another row: marked, not ramped. You already know you want to win it.
        if(c.mine) return `<td><span class="cell h2h${res}">${c.isHome?"":"@"}${short(c.opp)}<small class="num">${sub}</small>${c.kick?`<small class="tv">${c.kick}</small>`:""}</span></td>`;
        let a = Math.min(1, Math.abs(c.sw)/scale);
        if(Math.abs(c.sw)<0.5) a=0;
        const mix = a===0 ? 0 : Math.round(8+Math.pow(a,0.7)*82); // identical curve to the score pills
        const bg = a===0 ? "transparent" : `color-mix(in srgb, ${c.sw>0?"var(--for)":"var(--against)"} ${mix}%, transparent)`;
        return `<td><span class="cell${res}${mix>=60?" hot":""}" style="background:${bg}">${c.isHome?"":"@"}${short(c.opp)}<small class="num">${sub}</small>${c.kick?`<small class="tv">${c.kick}</small>`:""}</span></td>`;
      }).join("")+`</tr>`;
    }).join("");
}

// One card renderer for both the weekly slate and the season list
function card(g, showWeek){
  const wantHome=g.swing>0, want=wantHome?g.home:g.away;
  const line=g.spreadText ? `<b>${g.spreadText}</b>${g.overUnder?` · O/U ${g.overUnder}`:""}` : `<b>No line</b>`;
  // SP+ vs market: flag games where the two disagree by 10+ points of win probability
  let dev="";
  if(g.pLine!=null && Math.abs(g.pSp-g.pLine)>=0.10){
    const spFav = g.pSp>=0.5 ? g.home : g.away, spP = g.pSp>=0.5 ? g.pSp : 1-g.pSp;
    const mkP = spFav===g.home ? g.pLine : 1-g.pLine;
    dev=`<div class="g-dev">SP+ and the market disagree: SP+ has <b>${short(spFav)}</b> at ${Math.round(spP*100)}%, the line says ${Math.round(mkP*100)}%${g.line?"":" (sim is using SP+)"}</div>`;
  }
  const when=fmtKick(g);
  const impact=Math.abs(g.swing)*100;
  // the team you're pulling for is boxed; each team carries its win chance
  const chip=(team,win)=>{ const boxed = g.involvesMe ? team===T : (g.clear && team===want);
    return `<span class="chip${boxed?(g.involvesMe?" mine":" want"):""}">${badge(team)} <small class="num">(${fmtWin(win)}%)</small></span>`; };
  const noise = Math.abs(g.swing)<0.001 ? "no measurable effect" : `too close to call (±${(2*g.se*100).toFixed(2)} pts)`;
  // the selected team's own game: tint the card by its chance of winning, same ramp as the board
  let own="";
  if(g.involvesMe){
    const p = g.home===T ? g.pHomeWin : 1-g.pHomeWin, up=p>=0.5, k=Math.min(1,Math.abs(p-0.5)/0.5);
    own=` own" style="background:color-mix(in srgb, ${up?"var(--for)":"var(--against)"} ${Math.round(12+k*50)}%, transparent)`;
  }
  return `<div class="g${own}${dev?" dev":""}">
    <div class="g-top"><span>${when}${g.tv?` · ${g.tv}`:""}${showWeek?` · wk ${g.week}`:""}</span><span class="lev"><span>Leverage ${scorePill(g.lev>0?g.levN:null, g.clear)}</span><small>Impact ${scorePill(g.lev>0?g.impN:null, g.clear)}</small>${g.clear?"":`<small>${noise}</small>`}</span></div>
    <div class="g-match">${chip(g.away,1-g.pHomeWin)} <em>at</em> ${chip(g.home,g.pHomeWin)}</div>
    <div class="g-line">${line}</div>${dev}
  </div>`;
}

function renderSlate(r){
  const weeks=[...new Set(r.games.map(g=>g.week))].sort((a,b)=>a-b);
  if(UI.slateWeek===null||!weeks.includes(UI.slateWeek)) UI.slateWeek = weeks[0]; // earliest week that still has games to play
  const ws=$("#slateWeek"); ws.innerHTML=weeks.map(w=>`<option value="${w}" ${w===UI.slateWeek?"selected":""}>Week ${w}</option>`).join("");
  document.querySelectorAll("#slateSort button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===UI.slateSort)));
  $("#slateTitle").textContent=`Week ${UI.slateWeek} slate`;
  $("#slateExplain").innerHTML = `<p><strong>Impact</strong> is how much ${T}'s playoff odds move between the two outcomes of a game. <strong>Leverage</strong> is impact × how uncertain the game is: a coin flip keeps its full impact, a 97/3 game keeps about a tenth, because the result you'd want almost never happens. Both are scaled 0–100. Other teams' games are scored against the biggest such game left on the schedule; <strong>${T}'s own games are scored against each other</strong>, so your biggest game of the year is 100. Darker gold = higher score. Sort by kickoff to follow the day. Games with a gold edge are ones where <strong>SP+ and the betting market disagree</strong> by 10 or more points of win probability; the simulation uses SP+ unless you switch the toggle at the top.</p>`;
  let list=r.games.filter(g=>g.week===UI.slateWeek);
  if(UI.slateRanked) list=list.filter(g=>g.involvesMe||isRanked(g.home)||isRanked(g.away));
  const byTime=(a,b)=>(a.tbd-b.tbd)||((a.start?Date.parse(a.start):9e15)-(b.start?Date.parse(b.start):9e15))||(b.lev-a.lev);
  // the selected team's own game always leads; everything else follows the chosen sort
  const mine=list.filter(g=>g.involvesMe), rest=list.filter(g=>!g.involvesMe);
  rest.sort(UI.slateSort==="time" ? byTime : (a,b)=>b.lev-a.lev);
  const html = mine.map(g=>card(g,false)).join("") + (mine.length&&rest.length?`<div class="sub" style="padding:10px 0 2px">Rest of the slate, by ${UI.slateSort==="time"?"kickoff":"leverage score"}</div>`:"") + rest.map(g=>card(g,false)).join("");
  $("#slate").innerHTML = html || `<div class="sub" style="padding:10px 0">No games match.</div>`;
}

function renderSeason(r){
  document.querySelectorAll("#seasonSort button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===UI.seasonSort)));
  $("#seasonExplain").innerHTML = `<p>Every remaining game <strong>not involving ${T}</strong>, ranked by how much it matters to ${T}. Your own games are left out because they obviously dwarf everything else; they're on the Top 25 board and the weekly slate. <strong>Impact</strong> is the swing in playoff odds between the two outcomes; <strong>leverage</strong> discounts that by how unlikely the swing is to happen. Both are scaled 0–100 against the biggest of these games, and darker gold means a higher score.</p>`;
  const list=r.games.filter(g=>g.clear&&!g.involvesMe).sort(UI.seasonSort==="impact" ? (a,b)=>Math.abs(b.swing)-Math.abs(a.swing) : (a,b)=>b.lev-a.lev).slice(0,40);
  const quiet=r.games.filter(g=>!g.clear&&!g.involvesMe).length;
  $("#season").innerHTML = list.map(g=>card(g,true)).join("") + (quiet?`<details class="quiet"><summary>${quiet} more games with no measurable effect on ${T}</summary><div class="sub" style="margin-top:6px">They move the odds by less than a tenth of a point either way.</div></details>`:"");
}
</script>
</body>
</html>
